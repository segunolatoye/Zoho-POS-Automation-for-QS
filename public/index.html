async function refreshBackupsList() {
  try {
    const r = await fetch('/api/backups');
    const res = await r.json();
    const listEl = $('#backup-list');
    if (!listEl) return;
    if (!res.success || !res.backups || !res.backups.length) {
      listEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--mute);font-size:12.5px">No backups created yet. Click <b>Backup Now</b> to create one.</div>`;
      return;
    }
    listEl.innerHTML = res.backups.map(b => {
      const dateStr = new Date(b.created_at).toLocaleString();
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)">
          <div>
            <div style="font-weight:700;font-size:13px;color:var(--ink)"><i class="fa-solid fa-file-zipper" style="color:var(--brand);margin-right:6px"></i>${b.filename}</div>
            <div style="font-size:11px;color:var(--mute)">Created: ${dateStr} · Size: <b>${b.size_formatted}</b></div>
          </div>
          <a href="${b.download_url}" download class="btn" style="text-decoration:none;font-size:12px;padding:5px 12px;display:flex;align-items:center;gap:6px">
            <i class="fa-solid fa-download"></i> Download .ZIP
          </a>
        </div>
      `;
    }).join('');
  } catch(e) {
    const listEl = $('#backup-list');
    if (listEl) listEl.innerHTML = `<div style="padding:16px;color:var(--bad)">Error loading backups: ${e.message}</div>`;
  }
}

async function triggerManualBackup() {
  const btn = $('#btn-backup-now');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Backing up...`;
  }
  try {
    const r = await fetch('/api/backup/now', { method: 'POST' });
    const res = await r.json();
    if (res.success) {
      toast(`Backup snapshot created successfully! (${res.size_formatted})`);
      playSound('success');
      await refreshBackupsList();
    } else {
      toast('❌ Backup failed: ' + (res.message || 'Unknown error'));
    }
  } catch(e) {
    toast('❌ Error connecting to server: ' + e.message);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Backup Now`;
    }
  }
}

function searchPM(q) {
  const query = q.toLowerCase().trim();
  const div = $('#pm-results');
  if (!query) { div.innerHTML = ''; return; }
  const matches = state.items.filter(it => it.name.toLowerCase().includes(query)).slice(0, 6);
  div.innerHTML = matches.map(m => {
    const bulkU = (m.units || []).find(u => !u.is_base);
    const bulkLabel = bulkU ? (bulkU.unit_symbol || bulkU.name).toUpperCase() : 'Bulk';
    return `
      <div class="cust-bar" style="cursor:pointer" onclick="selectPMItem('${m.id}')">
        <b>${m.name}</b>
        <span style="font-size:11.5px;color:var(--mute)">Single: ${NGN(m.retail_price)} • ${bulkLabel}: ${NGN(m.carton_price)}</span>
      </div>
    `;
  }).join('');
}

function selectPMItem(id) {
  const it = getItem(id);
  if (!it) return;
  activePMItem = it;
  $('#pm-name').innerText = it.name;
  $('#pm-retail').value = it.retail_price;
  $('#pm-carton').value = it.carton_price;
  const bulkU = (it.units || []).find(u => !u.is_base);
  const bulkLabel = bulkU ? `${(bulkU.unit_symbol || bulkU.name).toUpperCase()} Bulk Price (₦)` : 'Bulk Price (₦)';
  const lbl = $('#pm-bulk-label');
  if (lbl) lbl.innerText = bulkLabel;
  $('#pm-editor').style.display = 'block';
}

async function savePriceUpdate() {
  if (!activePMItem) return;
  const retail = parseFloat($('#pm-retail').value) || 0;
  const carton = parseFloat($('#pm-carton').value) || 0;

  try {
    const r = await fetch('/api/catalog/update-price', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        item_id: activePMItem.id,
        retail_price: retail,
        carton_price: carton,
        user_role: state.user?.role || 'cashier',
        manager_pin: activePMManagerAuth ? activePMManagerAuth.pin : undefined
      })
    });
    const res = await r.json();
    if (res.success) {
      activePMItem.retail_price = retail;
      activePMItem.carton_price = carton;
      if (activePMItem.units && activePMItem.units.length) {
        const b = activePMItem.units.find(u => u.is_base);
        if (b) b.price = retail;
        const c = activePMItem.units.find(u => !u.is_base);
        if (c) c.price = carton;
      }
      closeModal();
      renderMain();
      toast(`✅ Prices updated for ${activePMItem.name}`);
    } else {
      toast('❌ Error: ' + res.message);
    }
  } catch(e) {
    toast('❌ Failed to update price: ' + e.message);
  }
}

function closeModal() {
  $('#ov').innerHTML = '';
}

function handleDiscountChange(val) {
  const num = Math.min(100, Math.max(0, parseFloat(val) || 0));
  if (num === 0) {
    state.disc = 0;
    state.managerDiscountApproved = false;
    state.managerApprovedBy = null;
    $('#cart').innerHTML = renderCartHTML();
    return;
  }

  // Manager or Finance logged in directly can apply discounts
  if (state.user && (state.user.role === 'admin' || state.user.role === 'finance' || state.user.role === 'manager')) {
    state.disc = num;
    state.managerDiscountApproved = true;
    state.managerApprovedBy = `${state.user.name} (${state.user.role.toUpperCase()})`;
    $('#cart').innerHTML = renderCartHTML();
    return;
  }

  // If cashier already got manager/finance approval for this cart with same or higher discount
  if (state.managerDiscountApproved && state.disc >= num) {
    state.disc = num;
    $('#cart').innerHTML = renderCartHTML();
    return;
  }

  // Cashier cannot apply discount without manager or finance pin
  openManagerOverrideModal({
    reason: `Cashiers cannot apply discounts without Manager or Finance PIN. Authorize ${num}% discount?`,
    onApprove: (manager) => {
      state.disc = num;
      state.managerDiscountApproved = true;
      state.managerApprovedBy = `${manager.name} (${manager.role.toUpperCase()})`;
      toast(`✅ Discount (${num}%) authorized by ${manager.name}.`);
      playSound('beep');
      $('#cart').innerHTML = renderCartHTML();
    },
    onReject: () => {
      state.disc = 0;
      state.managerDiscountApproved = false;
      state.managerApprovedBy = null;
      toast('❌ Discount denied: Cashiers cannot apply discounts without Manager or Finance PIN.');
      $('#cart').innerHTML = renderCartHTML();
    }
  });
}

function openManagerOverrideModal({ reason, onApprove, onReject }) {
  let pinBuf = '';

  function renderModal() {
    $('#ov').innerHTML = `
      <div class="ov">
        <div class="modal" style="width:380px;text-align:center;padding:24px">
          <div style="width:56px;height:56px;border-radius:50%;background:rgba(239,68,68,0.1);color:var(--bad);display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px">
            <i class="fa-solid fa-user-shield"></i>
          </div>
          <h3 style="margin:0 0 6px;font-size:18px">Manager / Finance Override</h3>
          <p style="margin:0 0 16px;color:var(--mute);font-size:13px">${reason || 'Authorization required for this action.'}</p>

          <div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px">
            <div style="font-size:11px;color:var(--mute);margin-bottom:4px">ENTER 4-DIGIT MANAGER OR FINANCE PIN</div>
            <div style="font-family:monospace;font-size:28px;letter-spacing:10px;font-weight:700;color:var(--ink);min-height:36px">
              ${'●'.repeat(pinBuf.length) || '<span style="color:var(--mute);font-size:14px;letter-spacing:0">Enter PIN</span>'}
            </div>
          </div>

          <div class="pin-pad" style="max-width:280px;margin:0 auto 16px">
            ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="pin-btn" onclick="managerPinDigit('${n}')">${n}</button>`).join('')}
            <button class="pin-btn clr" onclick="managerPinClear()">Clear</button>
            <button class="pin-btn" onclick="managerPinDigit('0')">0</button>
            <button class="pin-btn del" onclick="managerPinDel()"><i class="fa-solid fa-delete-left"></i></button>
          </div>

          <div style="display:flex;gap:10px">
            <button class="btn" style="flex:1" onclick="cancelManagerOverride()">Cancel</button>
            <button class="btn p" style="flex:1" onclick="submitManagerOverride()" ${pinBuf.length < 4 ? 'disabled' : ''}>Authorize</button>
          </div>
        </div>
      </div>
    `;
  }

  window.managerPinDigit = (d) => {
    if (pinBuf.length < 6) {
      pinBuf += d;
      playSound('beep');
      renderModal();
      if (pinBuf.length === 4) {
        setTimeout(submitManagerOverride, 150);
      }
    }
  };

  window.managerPinClear = () => {
    pinBuf = '';
    renderModal();
  };

  window.managerPinDel = () => {
    pinBuf = pinBuf.slice(0, -1);
    renderModal();
  };

  window.cancelManagerOverride = () => {
    closeModal();
    if (typeof onReject === 'function') onReject();
  };

  window.submitManagerOverride = async () => {
    if (!pinBuf) return;
    try {
      const r = await fetch('/api/users/verify-manager-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pinBuf })
      });
      const res = await r.json();
      if (res.success && res.manager) {
        closeModal();
        if (typeof onApprove === 'function') onApprove(res.manager);
      } else {
        playSound('error');
        toast('❌ ' + (res.message || 'Invalid Manager PIN.'));
        pinBuf = '';
        renderModal();
      }
    } catch (e) {
      toast('❌ Error verifying PIN: ' + e.message);
    }
  };

  renderModal();
}

let currentShiftData = null;

async function openShiftCloseModal() {
  const term = state.terminalId || 'TERM-01';
  let activeShift = null;
  try {
    const res = await fetch(`/api/shifts/active?terminal_id=${term}`).then(r => r.json());
    if (res && res.success && res.active_shift) {
      activeShift = res.active_shift;
    }
  } catch (e) {
    console.warn('Failed to load active shift:', e);
  }

  // If no active shift, offer to start one
  if (!activeShift) {
    openShiftFloatModal();
    return;
  }

  // Calculate live shift reconciliation stats
  const queue = state.sales || [];
  const shiftStart = new Date(activeShift.opened_at);
  const shiftSales = queue.filter(s => {
    const d = new Date(s.created_at || s.date);
    return d >= shiftStart && (!s.terminal_id || s.terminal_id === term);
  });

  let cashTotal = 0, cashCount = 0;
  let cardTotal = 0, cardCount = 0;
  let transferTotal = 0, transferCount = 0;
  let creditTotal = 0, creditCount = 0;
  let grossRev = 0;

  for (const s of shiftSales) {
    grossRev += (parseFloat(s.total) || 0);
    const mode = (s.payment_mode || 'CASH').toLowerCase();
    if (mode === 'cash') {
      cashTotal += (parseFloat(s.total) || 0);
      cashCount++;
    } else if (mode.includes('moniepoint') || mode.includes('card') || mode.includes('pos')) {
      cardTotal += (parseFloat(s.total) || 0);
      cardCount++;
    } else if (mode.includes('transfer') || mode.includes('bank')) {
      transferTotal += (parseFloat(s.total) || 0);
      transferCount++;
    } else if (mode.includes('credit') || mode.includes('debt') || mode.includes('account')) {
      creditTotal += (parseFloat(s.total) || 0);
      creditCount++;
    } else if (mode === 'split' && Array.isArray(s.payments)) {
      for (const p of s.payments) {
        const pMode = (p.mode || '').toLowerCase();
        const pAmt = parseFloat(p.amount) || 0;
        if (pMode === 'cash') { cashTotal += pAmt; cashCount++; }
        else if (pMode.includes('card') || pMode.includes('moniepoint')) { cardTotal += pAmt; cardCount++; }
        else if (pMode.includes('transfer')) { transferTotal += pAmt; transferCount++; }
        else { creditTotal += pAmt; creditCount++; }
      }
    } else {
      cashTotal += (parseFloat(s.total) || 0);
      cashCount++;
    }

    total_sales: shiftSales.length,
    gross_revenue: grossRev,
    cash_total: cashTotal,
    cash_count: cashCount,
    card_total: cardTotal,
    card_count: cardCount,
    transfer_total: transferTotal,
    transfer_count: transferCount,
    credit_total: creditTotal,
    credit_count: creditCount,
    expected_cash: expectedCash
  };

  $('#ov').innerHTML = `
    <div class="ov">
      <div class="modal" style="width:620px;max-height:88vh;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px">
          <div>
            <h3 style="margin:0;font-size:18px"><i class="fa-solid fa-file-invoice-dollar" style="color:var(--brand);margin-right:6px"></i> Shift Close & Z-Report</h3>
            <small style="color:var(--mute)">End-of-day financial reconciliation & cash drawer balancing</small>
          </div>
          <button class="rs" onclick="closeModal()" style="font-size:16px;padding:4px 10px">✕</button>
        </div>

        <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px">
          <!-- Active Shift Meta -->
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px">

            <div><span style="color:var(--mute)">Terminal:</span><br><b>${currentShiftData.terminal_id}</b></div>
            <div><span style="color:var(--mute)">Shift Start:</span><br><b>${currentShiftData.opened_at.split(' ')[1] || currentShiftData.opened_at}</b></div>
            <div><span style="color:var(--mute)">Transactions:</span><br><b style="color:var(--brand)">${currentShiftData.total_sales} sales</b></div>

function recalcZReportVariance(expectedCash) {
  const counted = parseFloat($('#counted-cash')?.value) || 0;
  const pill = $('#variance-pill');
  if (!pill) return;
  const diff = counted - expectedCash;
  if (diff === 0) {
    pill.style.background = 'rgba(34,197,94,0.15)';
    pill.style.color = '#15803d';
    pill.textContent = '✅ BALANCED (₦0.00)';
  } else if (diff > 0) {
    pill.style.background = 'rgba(234,179,8,0.15)';
    pill.style.color = '#a16207';
    pill.textContent = `⚠️ OVER (+${NGN(diff)})`;
  } else {
    pill.style.background = 'rgba(239,68,68,0.15)';
    pill.style.color = '#b91c1c';
    pill.textContent = `❌ SHORT (${NGN(diff)})`;
  }
}

function calcDenominations(expectedCash) {
  const n1000 = (parseInt($('#d1000')?.value, 10) || 0) * 1000;
  const n500 = (parseInt($('#d500')?.value, 10) || 0) * 500;
  const n200 = (parseInt($('#d200')?.value, 10) || 0) * 200;
  const n100 = (parseInt($('#d100')?.value, 10) || 0) * 100;
  const total = n1000 + n500 + n200 + n100;
  const countedInput = $('#counted-cash');
  if (countedInput) {
    countedInput.value = total;
    recalcZReportVariance(expectedCash);
  }
}

async function submitStartShift() {

  try {

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        terminal_id: state.terminalId || 'TERM-01',
        cashier_id: state.user?.id || 'u2',
        cashier_name: state.user?.name || 'Cashier 1',
        opening_float: floatVal
      })
    });
    const res = await r.json();

      toast(res.message);
      playSound('success');

      openShiftCloseModal();

      toast('❌ Failed to open shift: ' + res.message);

async function printShiftZReport() {
  if (!currentShiftData) return;
  const counted = parseFloat($('#counted-cash')?.value) || currentShiftData.expected_cash;
  const report = {
    ...currentShiftData,
    counted_cash: counted,
    variance: counted - currentShiftData.expected_cash
  };

  // Direct Thermal Printing (Silent direct print to thermal printer)
  if (state.pp.destination !== 'browser') {
    try {
      toast('Sending Z-Report to server receipt printer...');
      const r = await fetch('/api/hardware/print-zreport', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          report: report,
          printer_name: state.pp.printer === 'System default printer' ? '' : state.pp.printer,
          paper: state.pp.paper || '80'
        })
      });
      const res = await r.json();
      if (res.success) {
        toast('Z-Report printed successfully on thermal printer!');
        playSound('beep');
        return;
      }
    } catch(e) {
      console.warn('Server Z-report print failed, falling back to station print:', e);
    }
  }

  // Print directly from this terminal station
  $('#pgs').textContent = '@page{margin:0;size:' + (state.pp.paper === 'A4' ? 'A4' : state.pp.paper + 'mm auto') + '}';
  $('#prt').innerHTML = tickZReportHTML(report, state.pp);
  setTimeout(() => window.print(), 80);
}

async function finalizeShiftClose() {
  if (!currentShiftData) return;
  const countedVal = $('#counted-cash')?.value;
  if (countedVal === undefined || countedVal === '') {
    toast('⚠️ Please count physical cash in drawer and enter the amount before closing shift.');
    $('#counted-cash')?.focus();
    return;
  }

  const counted = parseFloat(countedVal) || 0;
  const diff = counted - currentShiftData.expected_cash;
  const diffStr = diff === 0 ? 'BALANCED (₦0.00)' : (diff > 0 ? `OVER +${NGN(diff)}` : `SHORT ${NGN(diff)}`);

  if (!confirm(`Are you sure you want to CLOSE this shift?\n\nExpected Cash: ${NGN(currentShiftData.expected_cash)}\nCounted Cash:  ${NGN(counted)}\nVariance:      ${diffStr}\n\nThis will finalize the Z-Report and log you out.`)) {
    return;
  }

  try {
    const r = await fetch('/api/shifts/close', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        terminal_id: currentShiftData.terminal_id,
        cashier_id: currentShiftData.cashier_id,
        cashier_name: currentShiftData.cashier_name,
        counted_cash: counted
      })
    });
    const res = await r.json();
    if (res.success) {
      toast('Shift closed successfully! Z-Report archived.');
      playSound('success');
      currentShiftData = res.report;
      printShiftZReport();
      closeModal();
      // Lock register to PIN screen for next cashier
      setTimeout(lockRegister, 500);
    } else {
      toast('❌ Error closing shift: ' + res.message);
    }
  } catch(e) {
    toast('❌ Error communicating with server: ' + e.message);
  }
}

// Keyboard shortcuts (F1 - F12, Ctrl+E, Lock screen PIN entry)
document.addEventListener('keydown', e => {
  if (state.isLocked) {
    if (e.key >= '0' && e.key <= '9') {
      e.preventDefault();
      enterPinDigit(e.key);
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      backspacePin();
    } else if (e.key === 'Escape' || e.key === 'Delete' || e.key === 'c' || e.key === 'C') {
      e.preventDefault();
      clearPin();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (state.pinInput.length === 4) submitPin();
    }
    return;
  }

  // Ctrl+E: Open Shift Close & Z-Report
  if (e.ctrlKey && (e.key === 'e' || e.key === 'E')) {
    e.preventDefault();
    openShiftCloseModal();
    return;
  }

  const k = e.key;
  if (k === 'F1') {
    e.preventDefault();
    const isManagerOrFinance = state.user && (state.user.role === 'admin' || state.user.role === 'finance' || state.user.role === 'manager');
    $('#ov').innerHTML = `
      <div class="ov"><div class="modal">
        <h3>Cashier Keyboard Shortcuts</h3>
        <div style="display:grid;gap:6px;font-size:12.5px;margin:12px 0">
          <div class="row"><kbd class="kk">Ctrl+E</kbd> <span>Shift Close / Z-Report</span></div>
          <div class="row"><kbd class="kk">F2</kbd> <span>Focus Search bar</span></div>
          <div class="row"><kbd class="kk">F3</kbd> <span>Toggle Sell / Orders view</span></div>
          <div class="row"><kbd class="kk">F4</kbd> <span>Select Customer</span></div>
          <div class="row"><kbd class="kk">F5</kbd> <span>Hold / Recall Parked Cart</span></div>
          <div class="row"><kbd class="kk">F6</kbd> <span>Cycle Payment Method (Cash, POS, Transfer, Split)</span></div>
          ${isManagerOrFinance ? '<div class="row"><kbd class="kk">F7</kbd> <span>Open Price Manager</span></div>' : ''}
          <div class="row"><kbd class="kk">F8</kbd> <span>Charge / Complete Sale</span></div>
          <div class="row"><kbd class="kk">F9</kbd> <span>Push Sales to Zoho (Shift+F9: Pull Stock & Cust)</span></div>
          <div class="row"><kbd class="kk">F10</kbd> <span>Toggle Theme</span></div>
          <div class="row"><kbd class="kk">F11</kbd> <span>Open Cash Drawer</span></div>
          <div class="row"><kbd class="kk">F12</kbd> <span>Print Last Receipt</span></div>
          <div class="row"><kbd class="kk">Esc</kbd> <span>Close active modal</span></div>
        </div>
        <button class="btn p" style="width:100%" onclick="closeModal()">Got it</button>
      </div></div>
    `;
  } else if (k === 'F2') {
    e.preventDefault();
    goView('sell');
    const q = $('#q');
    if (q) { q.focus(); q.select(); }
  } else if (k === 'F3') {
    e.preventDefault();
    goView(state.view === 'sell' ? 'orders' : 'sell');
  } else if (k === 'F4') {
    e.preventDefault();
    openCustomerModal();
  } else if (k === 'F6') {
    e.preventDefault();
    const modes = ['Cash', 'Moniepoint POS', 'First Bank Transfer', 'Split', 'Credit / On Account'];
    const next = modes[(modes.indexOf(state.pay) + 1) % modes.length];
    setPaymentMode(next);
    toast('Payment Mode: ' + next);
  } else if (k === 'F7') {
    e.preventDefault();
    openPriceManager();
  } else if (k === 'F8') {
    e.preventDefault();
    chargeSale();
  } else if (k === 'F9') {
    e.preventDefault();
    if (e.shiftKey) {
      triggerPullSync();
    } else {
      triggerSync();
    }
  } else if (k === 'F10') {
    e.preventDefault();
    toggleTheme();
  } else if (k === 'F11') {
    e.preventDefault();
    openCashDrawer();
  } else if (k === 'F12') {
    e.preventDefault();
    if (state.sales.length) previewPrintReceipt(state.sales[0].id);
  } else if (k === 'Escape') {
    closeModal();
  }
});

// Global Hardware Barcode Scanner Listener
let barcodeBuf = '';
let lastScanTime = 0;

document.addEventListener('keydown', e => {
  if (state.isLocked) return;
  const now = Date.now();
  const timeDiff = now - lastScanTime;
  lastScanTime = now;

  const active = document.activeElement;
  const isInput = active && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.tagName === 'TEXTAREA');

  if (e.key === 'Enter') {
    if (barcodeBuf.length >= 4) {
      const code = barcodeBuf.trim();
      barcodeBuf = '';
      const match = state.items.find(it => it.upc && it.upc.trim() === code) ||
                    state.items.find(it => it.sku && it.sku.toLowerCase() === code.toLowerCase()) ||
                    state.items.find(it => String(it.id) === code);
      if (match) {
        e.preventDefault();
        const added = addToCart(match.id);
        if (added) {
          toast(`Scanned & Added: ${match.name}`);
        }
        return;
      }
    }
    barcodeBuf = '';
    return;
  }

  // If characters arrive very rapidly (< 45ms between strokes) from hardware scanner
  if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    if (!isInput || active.id === 'q') {
      if (timeDiff > 120) {
        barcodeBuf = e.key;
      } else {
        barcodeBuf += e.key;
      }
    }
  }
});

async function refreshCurrentUser() {
  if (!state.user || !state.user.id) return;
  try {
    const r = await fetch('/api/auth/users');
    const users = await r.json();
    if (Array.isArray(users)) {
      const match = users.find(u => u.id === state.user.id);
      if (match && (match.name !== state.user.name || match.role !== state.user.role)) {
        state.user.name = match.name;
        state.user.role = match.role;
        sessionStorage.setItem('pos_user', JSON.stringify(state.user));
        renderTop();
        renderLockScreen();
      }
    }
  } catch(e) {}
}

// App Bootstrap
document.addEventListener('DOMContentLoaded', async () => {
  // Always lock register and enforce fresh PIN entry every time the app opens newly
  sessionStorage.removeItem('pos_user');
  state.user = null;
  state.isLocked = true;
  state.pinInput = '';
  renderLockScreen();

  if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      reg.update();
    }).catch(e => console.warn('PWA SW notice:', e));
  }
  await initTerminal();
  await loadInstalledPrinters();
  renderTop();
  renderNav();
  renderSb();
  renderMain();
  await loadCatalog();
  await loadCustomers();
  await loadQueueStatus();
  setInterval(loadQueueStatus, 15000);
});
