<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quality Superstores POS - Retail Register</title>
<link rel="icon" type="image/x-icon" href="/pos_icon.ico">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/pos_icon_192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #F4F6F9;
  --panel: #FFFFFF;
  --panel-alt: #F8FAFC;
  --ink: #0F172A;
  --mute: #64748B;
  --line: #E2E8F0;
  --line-light: #F1F5F9;
  --brand: #059669;
  --brand-hover: #047857;
  --brand-glow: rgba(5, 150, 105, 0.22);
  --on: #FFFFFF;
  --soft: #ECFDF5;
  --warn: #D97706;
  --warnbg: #FEF3C7;
  --bad: #DC2626;
  --badbg: #FEE2E2;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.03);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B0F17;
    --panel: #131B2A;
    --panel-alt: #182234;
    --ink: #F8FAFC;
    --mute: #94A3B8;
    --line: #222F43;
    --line-light: #1A2435;
    --brand: #10B981;
    --brand-hover: #34D399;
    --brand-glow: rgba(16, 185, 129, 0.25);
    --on: #041B12;
    --soft: rgba(16, 185, 129, 0.14);
    --warn: #F59E0B;
    --warnbg: rgba(245, 158, 11, 0.16);
    --bad: #EF4444;
    --badbg: rgba(239, 68, 68, 0.16);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
    --shadow-lg: 0 12px 24px rgba(0,0,0,0.45);
    --shadow-card: 0 2px 6px rgba(0,0,0,0.25);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0F17;
  --panel: #131B2A;
  --panel-alt: #182234;
  --ink: #F8FAFC;
  --mute: #94A3B8;
  --line: #222F43;
  --line-light: #1A2435;
  --brand: #10B981;
  --brand-hover: #34D399;
  --brand-glow: rgba(16, 185, 129, 0.25);
  --on: #041B12;
  --soft: rgba(16, 185, 129, 0.14);
  --warn: #F59E0B;
  --warnbg: rgba(245, 158, 11, 0.16);
  --bad: #EF4444;
  --badbg: rgba(239, 68, 68, 0.16);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 24px rgba(0,0,0,0.45);
  --shadow-card: 0 2px 6px rgba(0,0,0,0.25);
}

*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  overflow: hidden;
  font-variant-numeric: tabular-nums;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

input, select, textarea { -webkit-user-select: text; user-select: text; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; transition: all 0.15s ease; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Custom scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--mute); }

.app {
  height: 100%;
  min-width: 960px;
  display: grid;
  grid-template-rows: 58px 1fr 38px 28px;
}

/* Modern Top Header */
.top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.02em;
}

.mark {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, #059669 0%, #10B981 100%);
  color: #FFFFFF;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 16px;
  box-shadow: 0 2px 8px var(--brand-glow);
}

.reg-sel {
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 8px;
  padding: 6px 12px;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}
.reg-sel:hover {
  border-color: var(--brand);
  background: var(--panel);
  box-shadow: 0 0 0 2px var(--brand-glow);
}

.sp { flex: 1; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 99px;
  font-weight: 700;
  font-size: 11.5px;
  background: var(--soft);
  color: var(--brand);
  border: 1px solid rgba(5, 150, 105, 0.15);
}

.pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
  animation: pulse-dot 2s infinite;
}

.pill.off {
  background: var(--badbg);
  color: var(--bad);
  border-color: rgba(220, 38, 38, 0.2);
}
.pill.off i { animation: none; }

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}

.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 8px;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink);
  font-weight: 700;
  font-size: 12px;
}
.user-chip i { color: var(--brand); font-size: 14px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 8px;
  padding: 6px 12px;
  font-weight: 600;
  font-size: 12.5px;
  box-shadow: var(--shadow-sm);
}
.btn:hover {
  background: var(--bg);
  border-color: var(--mute);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }

.btn.p {
  background: linear-gradient(135deg, #059669 0%, #10B981 100%);
  color: #FFFFFF;
  border-color: transparent;
  box-shadow: 0 2px 6px var(--brand-glow);
}
.btn.p:hover {
  filter: brightness(1.06);
  box-shadow: 0 4px 12px var(--brand-glow);
}
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

.btn.icon-btn {
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 8px;
}

.spin {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: r .8s linear infinite;
  vertical-align: -2px;
  margin-right: 6px;
}
@keyframes r { to { transform: rotate(360deg); } }

/* Body Layout */
.body {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 0;
}

/* Modern Left Nav */
.nav {
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
}

.nav button {
  display: flex;
  align-items: center;
  gap: 9px;
  text-align: left;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mute);
  border: 1px solid transparent;
  background: none;
  position: relative;
  transition: all 0.15s ease;
  cursor: pointer;
}
.nav button:hover {
  background: var(--bg);
  color: var(--ink);
}
.nav button.on {
  background: var(--soft);
  color: var(--brand);
  border-color: rgba(5, 150, 105, 0.2);
  font-weight: 700;
}

.nav .gl {
  display: block;
  color: var(--mute);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 6px 10px 4px;
  letter-spacing: .06em;
}

.nav kbd, .sb kbd {
  margin-left: auto;
  font: 700 10.5px 'Plus Jakarta Sans', system-ui, sans-serif;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--mute);
  background: var(--bg);
}

.badge {
  position: static;
  margin-left: auto;
  background: var(--warn);
  color: #FFFFFF;
  border-radius: 99px;
  font-size: 11px;
  padding: 1px 8px;
  font-weight: 800;
}

.nb {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  background: var(--panel-alt);
  border-radius: 10px;
  padding: 12px;
  border: 1px solid var(--line);
}
.nb .row {
  padding: 4px 0;
  font-size: 11.5px;
  color: var(--mute);
  display: flex;
  justify-content: space-between;
}
.nb .row b { color: var(--ink); }

/* Main Sell Screen */
.sell {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(420px, 32vw, 480px);
  min-height: 0;
  background: var(--bg);
}

.left {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 14px 18px 0;
}

.tools {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 10px;
}

.search-wrap {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

.search-ico {
  position: absolute;
  left: 14px;
  color: var(--mute);
  font-size: 13px;
  pointer-events: none;
}

.search-kbd {
  position: absolute;
  right: 12px;
  pointer-events: none;
}
.search-kbd kbd {
  font: 700 10.5px 'Plus Jakarta Sans', system-ui, sans-serif;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 6px;
  color: var(--mute);
  background: var(--panel);
}

.search {
  width: 100%;
  border: 1.5px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 10px 42px 10px 38px;
  font-size: 13px;
  color: var(--ink);
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}
.search:focus {
  border-color: var(--brand);
  background: var(--panel);
  box-shadow: 0 0 0 3px var(--brand-glow);
  outline: none;
}

.cat-select {
  border: 1.5px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 9px 12px;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--ink);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
  min-width: 145px;
  max-width: 175px;
}
.cat-select:hover, .cat-select:focus {
  border-color: var(--brand);
  outline: none;
  box-shadow: 0 0 0 2px var(--brand-glow);
}

.cat-tag {
  font-size: 9.5px;
  font-weight: 800;
  padding: 1.5px 6px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--h) 14%, var(--panel));
  color: color-mix(in srgb, var(--h) 80%, var(--ink));
  letter-spacing: 0.03em;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1.2;
}

.seg {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--panel);
  box-shadow: var(--shadow-sm);
}
.seg button {
  border: 0;
  background: transparent;
  padding: 7px 12px;
  font-weight: 700;
  font-size: 12px;
  color: var(--mute);
  display: flex;
  align-items: center;
  gap: 5px;
}
.seg button.on {
  background: var(--soft);
  color: var(--brand);
}

/* Product Cards Grid */
.grid {
  overflow: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(162px, 1fr));
  gap: 12px;
  align-content: start;
  padding: 2px 2px 18px;
}
.grid.list { display: block; padding: 0 0 14px; }

.tile {
  text-align: left;
  border: 1.5px solid var(--line);
  background: var(--panel);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  transition: all 0.18s ease;
  box-shadow: var(--shadow-card);
}
.tile:hover {
  border-color: var(--brand);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.tile.out { opacity: .45; cursor: not-allowed; }
.tile.out:hover { transform: none; border-color: var(--line); box-shadow: var(--shadow-card); }

.art {
  height: 56px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 19px;
  background: color-mix(in srgb, var(--h) 15%, var(--panel));
  color: color-mix(in srgb, var(--h) 75%, var(--ink));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
}

.tile b {
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.35;
  min-height: 34px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--ink);
}

.tile .m {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--mute);
  font-size: 11.5px;
  gap: 6px;
}
.tile .m span:first-child {
  color: var(--ink);
  font-weight: 800;
  font-size: 13.5px;
}

.stock-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 99px;
  font-size: 10.5px;
  font-weight: 700;
  white-space: nowrap;
}
.stock-pill.in { background: var(--soft); color: var(--brand); }
.stock-pill.low { background: var(--warnbg); color: var(--warn); }
.stock-pill.out { background: var(--badbg); color: var(--bad); }

.us {
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 11.5px;
  font-weight: 600;
  width: 100%;
  cursor: pointer;
}
.us:focus { border-color: var(--brand); outline: none; }

/* Table View */
.pt {
  width: 100%;
  table-layout: fixed;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--panel);
  border-radius: 10px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.pt th, .pt td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.pt th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--panel);
  color: var(--mute);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.pt td.td-name {
  white-space: normal;
  word-break: break-word;
  line-height: 1.3;
}
.pt th.col-act, .pt td.col-act {
  position: sticky;
  right: 0;
  z-index: 3;
  background: var(--panel);
  text-align: right;
  box-shadow: -3px 0 6px rgba(0,0,0,0.05);
}
.pt tr:hover td.col-act {
  background: var(--soft);
}
.pr { cursor: pointer; transition: background 0.12s; }
.pr:hover td { background: var(--soft); }
.pr.out { opacity: .45; cursor: not-allowed; }

.av {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  margin-right: 8px;
  font-weight: 800;
  font-size: 11px;
  vertical-align: middle;
  background: color-mix(in srgb, var(--h) 15%, var(--panel));
  color: color-mix(in srgb, var(--h) 75%, var(--ink));
}

/* Right Cart Panel */
.cart {
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  box-shadow: -2px 0 8px rgba(0,0,0,0.02);
}

.cart-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cust-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12.5px;
  transition: all 0.15s ease;
}
.cust-bar:hover { border-color: var(--brand); }
.cust-bar b {
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 240px;
  font-weight: 700;
}

.debt-alert {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #DC2626;
  background: #FEE2E2;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 4px;
  margin-top: 3px;
  border: 1px solid rgba(220, 38, 38, 0.2);
}

.lines {
  flex: 1;
  overflow: auto;
  padding: 4px 18px;
}

.empty {
  color: var(--mute);
  padding: 50px 14px;
  text-align: center;
  line-height: 1.6;
  font-size: 13px;
}

.cart-col-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1.5px solid var(--line);
  font-size: 10.5px;
  font-weight: 800;
  color: var(--mute);
  letter-spacing: .06em;
  user-select: none;
}
.cart-col-hdr .c-item { flex: 1; min-width: 0; }
.cart-col-hdr .c-unit { width: 72px; }
.cart-col-hdr .c-qty { width: 74px; text-align: center; }
.cart-col-hdr .c-tot { width: 80px; text-align: right; }
.cart-col-hdr .c-act { width: 24px; }

.ln {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  min-height: 42px;
  transition: background 0.12s;
}
.ln:hover { background: var(--line-light); border-radius: 6px; padding-left: 4px; padding-right: 4px; }

.ln .nm {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--ink);
}

.ln .us-cart {
  width: 72px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 6px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 6px;
  flex-shrink: 0;
}
.ln .us-cart:disabled { opacity: .6; cursor: default; }

.ln .qty {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  flex-shrink: 0;
  height: 28px;
  background: var(--bg);
  overflow: hidden;
}
.qty button {
  border: 0;
  background: none;
  width: 24px;
  height: 28px;
  font-size: 14px;
  font-weight: 700;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--ink);
  transition: all 0.1s;
}
.qty button:hover {
  background: var(--soft);
  color: var(--brand);
}
.qty span {
  min-width: 24px;
  text-align: center;
  font-weight: 800;
  font-size: 12px;
  color: var(--ink);
}

.ln .tot {
  width: 80px;
  text-align: right;
  font-weight: 800;
  font-size: 13px;
  color: var(--ink);
  flex-shrink: 0;
  cursor: pointer;
}
.ln .tot:hover { color: var(--brand); text-decoration: underline; }
.ln .tot.ch { color: var(--warn); }

<script>
const NGN = n => '₦' + Math.round(n).toLocaleString('en-NG');
const T = t => new Date(t).toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' });
const $ = s => document.querySelector(s);

// Category hue palette
const HUE_MAP = {
  'GROCERY': '#17674A',
  'BEVERAGES': '#2B6CB0',
  'TOILETRIES': '#7B4FA3',
  'BRUSH': '#B8741A',
  'HOUSEHOLD': '#9A5F10',
  'GENERAL': '#4A5568'
};

const getHue = cat => HUE_MAP[(cat || '').toUpperCase()] || '#17674A';

let state = {
  view: 'sell',
  vw: 'list', // 'list' or 'grid'
  theme: 'auto',
  terminalId: localStorage.getItem('pos_terminal_id') || '',
  user: JSON.parse(sessionStorage.getItem('pos_user') || 'null'),
  isLocked: !sessionStorage.getItem('pos_user'),
  pinInput: '',
  customer: { id: '1560234000000102202', name: 'Walk in Customer' },
  cat: 'All',
  q: '',
  cart: {}, // id: { qty, unitIndex, customPrice }
  heldCarts: JSON.parse(localStorage.getItem('qs_held_carts') || '[]'),
  disc: 0,
  pay: 'Cash',
  tender: '',
  syncing: false,
  pulling: false,
  items: [],
  customers: [],
  sales: [],
  pendingCount: 0,
  lastSyncTime: null,
  lanIp: '192.168.100.18',
  lanUrl: 'http://192.168.100.18:3001',
  installedPrinters: [],
  pp: {
    printer: 'System default printer',
    printMode: 'direct', // 'direct' (Silent ESC/POS) or 'browser' (Dialog)
    autoKickDrawer: true, // Auto kick RJ11 drawer pulse on Cash sales
    paper: '80',
    copies: 1,
    hdr: true,
    vat: false,
    companyName: 'QUALITY SUPERSTORES',
    address: '16, Ogo Oluwa St, Ketere Market, Sango, Ogun State',
    phones: '0803 456 7890, 0812 345 6789',
    branch: 'KETERE BRANCH',
    salesperson: 'Cashier 1'
  }
};

// Apply preferences
try {
  const p = JSON.parse(localStorage.getItem('qs-prefs') || 'null');
  if (p) {
    state.theme = p.theme || 'auto';
    if (p.pp) {
      Object.assign(state.pp, p.pp);
      if (state.pp.address === 'Ketere Market Road, Saki, Oyo State' || !state.pp.address) {
        state.pp.address = '16, Ogo Oluwa St, Ketere Market, Sango, Ogun State';
      }
    }
  }
} catch(e) {}

function applyTheme() {
  const r = document.documentElement;
  if (state.theme === 'auto') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', state.theme);
}
applyTheme();

function savePrefs() {
  try {
    localStorage.setItem('qs-prefs', JSON.stringify({ theme: state.theme, pp: state.pp }));
  } catch(e) {}
}

function saveHeldCarts() {
  try {
    localStorage.setItem('qs_held_carts', JSON.stringify(state.heldCarts));
  } catch(e) {}
}

// Audio Synthesizer via Web Audio API (zero audio files needed, works offline)
let audioCtx = null;
function playSound(type) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'beep' || type === 'scan') {
      // Crisp 880Hz -> 1320Hz electronic cashier beep (60ms)
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.05);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now);
      osc.stop(now + 0.06);
    } else if (type === 'error' || type === 'out') {
      // Low dual warning buzz (180ms)
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(180, now + 0.08);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.start(now);
      osc.stop(now + 0.18);
    } else if (type === 'success' || type === 'sale') {
      // Melodic 2-tone chime on successful payment
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    }
  } catch(e) {}
}

function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.style.display = 'none', 3800);
}

// Helpers for items
function getItem(id) {
  return state.items.find(it => String(it.id) === String(id));
}

function getItemUnits(it) {
  if (!it || !it.units || !it.units.length) {
    return [{ name: it?.base_unit || 'unit', label: 'Unit', price: it?.retail_price || 0, is_base: true, conversion_ratio: 1, unit_conversion_id: '' }];
  }
  return it.units;
}

function getCartLine(id) {
  const it = getItem(id);
  if (!it) return null;
  const c = state.cart[id] || { qty: 1, unitIndex: 0, customPrice: null };
  const units = getItemUnits(it);
  const u = units[c.unitIndex] || units[0];
  const listPrice = u.price;
  const activePrice = c.customPrice !== null ? c.customPrice : listPrice;
  return {
    item: it,
    qty: c.qty,
    unitIndex: c.unitIndex,
    unit: u,
    listPrice: listPrice,
    price: activePrice,
    total: activePrice * c.qty
  };
}

function calcTotals() {
  let sub = 0, n = 0;
  for (const id in state.cart) {
    const L = getCartLine(id);
    if (L) {
      sub += L.total;
      n += L.qty;
    }
  }
  const disc = (sub * state.disc) / 100;
  const total = sub - disc;
  return { sub, n, disc, total };
}

function enterPinDigit(d) {
  if (state.pinInput.length >= 4) return;
  state.pinInput += String(d);
  renderLockScreen();
  if (state.pinInput.length === 4) {
    submitPin();
  }
}

function backspacePin() {
  state.pinInput = state.pinInput.slice(0, -1);
  renderLockScreen();
}

function clearPin() {
  state.pinInput = '';
  renderLockScreen();
}

async function submitPin() {
  const pin = state.pinInput;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    }).then(r => r.json());

    if (res && res.success && res.user) {
      state.user = res.user;
      sessionStorage.setItem('pos_user', JSON.stringify(res.user));
      state.isLocked = false;
      state.pinInput = '';
      if (res.user.terminal_id) {
        state.terminalId = res.user.terminal_id;
        localStorage.setItem('pos_terminal_id', res.user.terminal_id);
      }
      renderLockScreen();
      renderTop();
      renderSb();
      toast(`✓ Unlocked! Welcome, ${res.user.name}`);
    } else {
      const card = $('#pin-card');
      if (card) {
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 450);
      }
      const errEl = $('#pin-err');
      if (errEl) errEl.textContent = res.message || 'Invalid PIN. Try again.';
      state.pinInput = '';
      setTimeout(() => renderLockScreen(), 600);
    }
  } catch(e) {
    const errEl = $('#pin-err');
    if (errEl) errEl.textContent = 'Server connection error';
    state.pinInput = '';
  }
}

function lockRegister() {
  state.isLocked = true;
  state.pinInput = '';
  sessionStorage.removeItem('pos_user');
  renderLockScreen();
  toast('🔒 Cash register locked');
}

              <button class="${state.vw==='grid'?'on':''}" onclick="setViewMode('grid')" title="Grid View"><i class="fa-solid fa-table-cells-large"></i> Grid</button>
            </div>
          </div>
          <div class="grid ${state.vw}" id="grid">${renderCatalogHTML()}</div>
        </section>
        <aside class="cart" id="cart">${renderCartHTML()}</aside>
      </div>
    `;
  } else {
    renderOrdersView();
  }
}

function setCategory(c) {
  state.cat = c;
  $('#grid').innerHTML = renderCatalogHTML();
}

function setViewMode(m) {
  state.vw = m;
  renderMain();
}

function handleSearch(val) {
  state.q = val;
  $('#grid').innerHTML = renderCatalogHTML();
}

function handleSearchKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const q = state.q.toLowerCase().trim();
    if (!q) return;
    const filtered = state.items.filter(it => {
      const matchUpc = it.upc && (it.upc.trim() === q || it.upc.includes(q));
      const matchSku = it.sku && it.sku.toLowerCase() === q;
      const matchName = it.name.toLowerCase().includes(q);
      const matchId = it.id && String(it.id) === q;
      return matchUpc || matchSku || matchName || matchId;
    });
    if (filtered.length > 0) {
      const exact = filtered.find(it => it.upc && it.upc.trim() === q) ||
                    filtered.find(it => it.sku && it.sku.toLowerCase() === q) ||
                    filtered.find(it => it.name.toLowerCase() === q) ||
                    filtered[0];
      const added = addToCart(exact.id);
      state.q = '';
      const input = $('#q');
      if (input) input.value = '';
      $('#grid').innerHTML = renderCatalogHTML();
      if (added) {
        toast(`Scanned & Added: ${exact.name}`);
      }
    } else {
      toast(`No product found matching "${q}"`);
    }
  }
}

function getUnitRatio(u) {
  if (!u) return 1;
  if (u.is_base) return 1;
  if (u.units_per_bulk) return u.units_per_bulk;
  if (u.conversion_ratio > 1) return u.conversion_ratio;
  if (u.conversion_ratio > 0 && u.conversion_ratio < 1) return Math.round(1 / u.conversion_ratio);
  return 1;
}

// Inventory Count calculation across packaging units
function getStockInfo(it, unitIdx) {
  const units = getItemUnits(it);
  const curIdx = unitIdx != null ? unitIdx : (itemPickUnit[it.id] || 0);
  const selectedUnit = units[curIdx] || units[0];

  const bulkUnit = units.find(u => !u.is_base) || units[units.length - 1];
  const baseUnit = units.find(u => u.is_base) || units[0];
  const ratio = getUnitRatio(bulkUnit);

  // Raw recorded stock in bulk units
  const rawBulk = parseFloat(it.stock) || 0;
  
  // Local quantity in cart
  const cartItem = state.cart[it.id];
  const cartRatio = cartItem ? getUnitRatio(units[cartItem.unitIndex]) : 1;
  const inCartBase = cartItem ? (cartItem.qty * cartRatio) : 0;
  
  // Total available in base units (packs / pieces)
  const totalBase = Math.max(0, Math.round(rawBulk * ratio) - inCartBase);

  if (totalBase <= 0) {
    return {
      totalBase: 0,
      isOut: true,
      isLow: false,
      text: 'Out of stock'
    };
  }

  if (selectedUnit.is_base || ratio === 1) {
    const sym = (selectedUnit.unit_symbol || selectedUnit.name || 'pcs').toLowerCase();
    return {
      totalBase: totalBase,
      isOut: false,
      isLow: totalBase <= (ratio > 1 ? ratio : 5),
      text: `${totalBase.toLocaleString()} ${sym}`
    };
  } else {
    const whole = Math.floor(totalBase / ratio);
    const rem = totalBase % ratio;
    const bulkSym = (selectedUnit.unit_symbol || selectedUnit.name || 'ctn').toLowerCase();
    const baseSym = (baseUnit.unit_symbol || baseUnit.name || 'pcs').toLowerCase();

    let text = `${whole} ${bulkSym}`;
    if (rem > 0) {
      text += ` + ${rem} ${baseSym}`;
    }

    return {
      totalBase: totalBase,
      isOut: false,
      isLow: whole < 2,
      text: text
    };
  }
}

function renderCatalogHTML() {

      (it.id && String(it.id).includes(q));

    const matchesCat = cat === 'ALL' || itemCat === cat || (cat === 'FOODS' && (itemCat === 'FOODS' || itemCat === 'SEASONING' || itemCat === 'TOMATO PASTE')) || (cat === 'BEVERAGES' && (itemCat === 'BEVERAGES' || itemCat === 'DRINK'));
    return matchesQ && matchesCat;
  });

  if (!filtered.length) {
    return `<div class="empty" style="grid-column:1/-1">No items match your search.</div>`;
  }

  if (state.vw === 'list') {
    return `
      <table class="pt">

        </colgroup>
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Unit</th>
            <th style="text-align:right">Stock</th>
            <th style="text-align:right">Unit Price</th>
            <th style="text-align:right">Pack Price</th>
            <th class="col-act" style="text-align:right">Action</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(it => {
            const units = getItemUnits(it);
            const curIdx = itemPickUnit[it.id] != null ? itemPickUnit[it.id] : 0;
            const activeUnit = units[curIdx] || units[0];
            const stockInfo = getStockInfo(it, curIdx);

            const baseUnit = units.find(u => u.is_base) || units[0];
            const bulkUnit = units.find(u => !u.is_base);
            const singlePrice = baseUnit ? baseUnit.price : (it.retail_price || 0);

            return `
              <tr class="pr ${stockInfo.isOut ? 'out' : ''}" onclick="${stockInfo.isOut ? '' : `addToCart('${it.id}')`}">
                <td class="td-name">

                    <span class="av" style="--h:${getHue(it.category)}">${it.name[0]}</span>
                    <div style="min-width:0;flex:1">
                      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                        <b style="font-size:12.5px;color:var(--ink)">${it.name}</b>
                        <span class="cat-tag" style="--h:${getHue(it.category)}">${it.category || 'General'}</span>
                      </div>
                      ${it.upc ? `<div style="color:var(--mute);font-size:10px;margin-top:1px"><i class="fa-solid fa-barcode"></i> ${it.upc}</div>` : ''}
                    </div>
                  </div>
                </td>
                <td onclick="event.stopPropagation()">
                  <select class="us" onchange="setItemUnit('${it.id}', this.value)" ${stockInfo.isOut ? 'disabled' : ''}>
                    ${units.map((u, idx) => `<option value="${idx}" ${idx===curIdx?'selected':''}>${(u.unit_symbol || u.name).toUpperCase()}</option>`).join('')}
                  </select>
                </td>
                <td style="text-align:right">
                  <span class="stock-pill ${stockInfo.isOut ? 'out' : (stockInfo.isLow ? 'low' : 'in')}">
                    ${stockInfo.text}
                  </span>
                </td>
                <td style="text-align:right;font-weight:700;font-size:12px">${NGN(singlePrice)}</td>
                <td style="text-align:right;font-weight:800;font-size:12px;color:var(--brand)">${bulkPrice ? NGN(bulkPrice) : '<span style="color:var(--mute)">–</span>'}</td>
                <td class="col-act" style="text-align:right">
                  ${stockInfo.isOut

    `;
  }

  return filtered.map(it => {
    const units = getItemUnits(it);
    const curIdx = itemPickUnit[it.id] != null ? itemPickUnit[it.id] : 0;
    const activeUnit = units[curIdx] || units[0];
    const stockInfo = getStockInfo(it, curIdx);

    const baseUnit = units.find(u => u.is_base) || units[0];
    const bulkUnit = units.find(u => !u.is_base);
    const singlePrice = baseUnit ? baseUnit.price : (it.retail_price || 0);
    const bulkPrice = bulkUnit ? bulkUnit.price : (it.carton_price || null);

    return `

}

// Unit picker per catalog card
const itemPickUnit = {};
function setItemUnit(id, unitIdx) {
  itemPickUnit[id] = parseInt(unitIdx, 10);
  $('#grid').innerHTML = renderCatalogHTML();
}

// Cart actions with strict out-of-stock guard
function addToCart(id) {
  const it = getItem(id);
  if (!it) return false;

  const units = getItemUnits(it);
  const uIdx = state.cart[id] ? state.cart[id].unitIndex : (itemPickUnit[id] || 0);
  const selectedUnit = units[uIdx] || units[0];
  const unitRatio = getUnitRatio(selectedUnit);

  const bulkUnit = units.find(u => !u.is_base) || units[units.length - 1];
  const bulkRatio = getUnitRatio(bulkUnit);
  const rawBulk = parseFloat(it.stock) || 0;
  const maxAvailableBase = Math.round(rawBulk * bulkRatio);

  if (maxAvailableBase <= 0) {
    playSound('error');
    toast(`⛔ Cannot add "${it.name}": Product is OUT OF STOCK.`);
    return false;
  }

  const curQty = state.cart[id] ? state.cart[id].qty : 0;
  const newQty = curQty + 1;
  const neededBase = newQty * unitRatio;

  if (neededBase > maxAvailableBase) {
    playSound('error');
    const unitName = (selectedUnit.name || selectedUnit.unit_symbol || 'units').toUpperCase();
    const maxUnitsInSelected = Math.floor(maxAvailableBase / unitRatio);
    if (maxUnitsInSelected <= 0) {
      toast(`⚠️ Stock limit for "${it.name}": Only ${maxAvailableBase} base units left (cannot form 1 full ${unitName}).`);
    } else {
      toast(`⚠️ Stock limit reached for "${it.name}": Only ${maxUnitsInSelected} ${unitName} available.`);
    }
    return false;
  }

  if (!state.cart[id]) {
    state.cart[id] = { qty: 1, unitIndex: uIdx, customPrice: null };
  } else {
    state.cart[id].qty = newQty;
  }
  playSound('beep');
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
  return true;
}

function decCart(id) {
  if (state.cart[id]) {
    playSound('beep');
    state.cart[id].qty--;
    if (state.cart[id].qty <= 0) delete state.cart[id];
  }
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
}

function setCartUnit(id, unitIdx) {
  if (state.cart[id]) {
    const it = getItem(id);
    if (it) {
      const units = getItemUnits(it);
      const targetUnit = units[unitIdx] || units[0];
      const targetRatio = getUnitRatio(targetUnit);
      const bulkUnit = units.find(u => !u.is_base) || units[units.length - 1];
      const bulkRatio = getUnitRatio(bulkUnit);
      const rawBulk = parseFloat(it.stock) || 0;
      const maxAvailableBase = Math.round(rawBulk * bulkRatio);

      const neededBase = state.cart[id].qty * targetRatio;
      if (neededBase > maxAvailableBase) {
        toast(`⚠️ Insufficient stock to switch "${it.name}" to ${(targetUnit.name || '').toUpperCase()} (Needs ${neededBase} base units, only ${maxAvailableBase} available).`);
        $('#cart').innerHTML = renderCartHTML();
        return;
      }
    }
    state.cart[id].unitIndex = parseInt(unitIdx, 10);
    state.cart[id].customPrice = null; // reset custom price to list price
    itemPickUnit[id] = parseInt(unitIdx, 10);
  }
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
}

function setCartPrice(id, val) {
  const p = parseFloat(val);
  if (state.cart[id] && !isNaN(p) && p >= 0) {
    state.cart[id].customPrice = p;
  }
  $('#cart').innerHTML = renderCartHTML();
}

function resetCartPrice(id) {
  if (state.cart[id]) state.cart[id].customPrice = null;
  const hasOtherCustom = Object.values(state.cart).some(c => c.customPrice !== null);
  if (!hasOtherCustom) {
    state.managerPriceApproved = false;
    state.managerPriceApprovedBy = null;
  }
  $('#cart').innerHTML = renderCartHTML();
}

function removeCartItem(id) {
  if (state.cart[id]) {
    delete state.cart[id];
  }
  const hasOtherCustom = Object.values(state.cart).some(c => c.customPrice !== null);
  if (!hasOtherCustom) {
    state.managerPriceApproved = false;
    state.managerPriceApprovedBy = null;
  }
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
}

function editCartItemPrice(id) {
  const L = getCartLine(id);
  if (!L) return;

  const isCashier = !state.user || state.user.role === 'cashier';
  if (isCashier) {
    openManagerOverrideModal({
      reason: `Cashiers cannot change prices on orders. Manager or Finance PIN required to edit rate for "${L.item.name}".`,
      onApprove: (manager) => {
        promptPriceChange(id, L, manager);
      },
      onReject: () => {
        toast('❌ Price modification cancelled: Cashiers cannot modify item prices.');
      }
    });
    return;
  }

  promptPriceChange(id, L, null);
}

function promptPriceChange(id, L, authorizedBy) {
  const isCustom = L.price !== L.listPrice;
  const promptText = isCustom
    ? `Current custom price: ₦${L.price.toLocaleString()} (List: ₦${L.listPrice.toLocaleString()})\nEnter new price per ${L.unit.name || 'unit'}, or leave empty to reset:`
    : `List price: ₦${L.listPrice.toLocaleString()}\nEnter custom price per ${L.unit.name || 'unit'}:`;
  const val = prompt(promptText, L.price);
  if (val !== null) {
    const trimmed = val.trim();
    if (trimmed === '' || (isCustom && parseFloat(trimmed) === L.listPrice)) {
      resetCartPrice(id);
      toast(`Reset "${L.item.name}" to standard catalog price.`);
    } else {
      const p = parseFloat(trimmed);
      if (!isNaN(p) && p >= 0) {
        setCartPrice(id, Math.round(p));
        if (authorizedBy) {
          state.managerPriceApproved = true;
          state.managerPriceApprovedBy = `${authorizedBy.name} (${authorizedBy.role.toUpperCase()})`;
        }
        toast(`✅ Price updated to ₦${Math.round(p).toLocaleString()}${authorizedBy ? ' (Authorized by ' + authorizedBy.name + ')' : ''}`);
      }
    }
  }
}

function clearCart() {
  if (!Object.keys(state.cart).length) return;
  state.cart = {};
  state.disc = 0;
  state.managerDiscountApproved = false;
  state.managerApprovedBy = null;
  state.managerPriceApproved = false;
  state.managerPriceApprovedBy = null;
  state.tender = '';
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
}

function setPaymentMode(mode) {
  state.pay = mode;
  if (mode === 'Split' && !state.split) {
    state.split = { cash: 0, moniepoint: 0, transfer: 0 };
  }
  $('#cart').innerHTML = renderCartHTML();
}

function updateSplitAmount(field, val) {
  if (!state.split) state.split = { cash: 0, moniepoint: 0, transfer: 0 };
  const p = parseFloat(val);
  state.split[field] = isNaN(p) ? 0 : Math.max(0, Math.round(p));
  $('#cart').innerHTML = renderCartHTML();
}

function fillSplitRemaining(field) {
  const t = calcTotals();
  if (!state.split) state.split = { cash: 0, moniepoint: 0, transfer: 0 };
  let otherAlloc = 0;
  for (const k in state.split) {
    if (k !== field) otherAlloc += (parseFloat(state.split[k]) || 0);
  }
  const rem = Math.max(0, Math.round(t.total - otherAlloc));
  state.split[field] = rem;
  $('#cart').innerHTML = renderCartHTML();
}

function renderCartHTML() {
  const t = calcTotals();
  const ids = Object.keys(state.cart);
  const tend = parseFloat(state.tender) || 0;
  const short = state.pay === 'Cash' && state.tender !== '' && tend < t.total;

  const splitCash = parseFloat(state.split?.cash) || 0;
  const splitMoniepoint = parseFloat(state.split?.moniepoint) || 0;
  const splitTransfer = parseFloat(state.split?.transfer) || 0;
  const splitTotal = splitCash + splitMoniepoint + splitTransfer;
  const splitDiff = t.total - splitTotal;
  const splitBalanced = Math.abs(splitDiff) < 1;

  let chargeDisabled = !t.n;
  let chargeButtonLabel = 'Charge ' + NGN(t.total) + ' (F8)';

  if (state.pay === 'Cash') {
    if (short) {
      chargeDisabled = true;
      chargeButtonLabel = 'Cash received is too low';
    }
  } else if (state.pay === 'Split') {
    if (!splitBalanced) {
      chargeDisabled = true;
      chargeButtonLabel = splitDiff > 0 ? `Allocate remaining ₦${splitDiff.toLocaleString()}` : `Over-allocated by ₦${(-splitDiff).toLocaleString()}`;
    } else {
      chargeButtonLabel = `Charge ${NGN(t.total)} (Split Tender)`;
    }
  }

  const lines = ids.length ? `
    <div class="cart-col-hdr">
      <span class="c-item">ITEM</span>
      <span class="c-unit">UNIT</span>
      <span class="c-qty">QTY</span>
      <span class="c-tot">TOTAL</span>
      <span class="c-act"></span>
    </div>
    ${ids.map(id => {
      const L = getCartLine(id);
      if (!L) return '';
      const units = getItemUnits(L.item);
      const ch = L.price !== L.listPrice;
      const isCashier = !state.user || state.user.role === 'cashier';
      return `
        <div class="ln">
          <div class="nm" title="${L.item.name} (${L.unit.name || ''})">${L.item.name}</div>
          <select class="us-cart" onchange="setCartUnit('${id}', this.value)" aria-label="Unit" ${units.length < 2 ? 'disabled' : ''}>
            ${units.map((u, idx) => `<option value="${idx}" ${idx===L.unitIndex?'selected':''}>${(u.unit_symbol || u.name).toUpperCase()}</option>`).join('')}
          </select>
          <div class="qty">
            <button onclick="decCart('${id}')" aria-label="Minus">−</button>
            <span>${L.qty}</span>
            <button onclick="addToCart('${id}')" aria-label="Plus">+</button>
          </div>
          <b class="tot ${ch ? 'ch' : ''}" onclick="editCartItemPrice('${id}')" title="${isCashier ? `₦${L.price.toLocaleString()} each (Locked - Requires Manager/Finance PIN to change)` : `₦${L.price.toLocaleString()} each (Click to edit rate)`}">${NGN(L.total)}</b>
          <button class="del-btn" onclick="removeCartItem('${id}')" title="Remove item">×</button>
        </div>
      `;
    }).join('')}
  ` : `<div class="empty">The cart is empty.<br>Click any item from the catalog or press F2 to scan.</div>`;

  return `
    <div class="cart-header">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0;font-size:15px;font-weight:800;letter-spacing:-0.01em">Current Sale</h2>
        <div style="display:flex;gap:5px;align-items:center">
          <button class="btn" style="padding:3px 8px;font-size:11px" onclick="holdCurrentCart()" title="Park current cart on hold (F5)" ${!ids.length ? 'disabled' : ''}>
            <i class="fa-solid fa-pause"></i> Hold (F5)
          </button>
          <button class="btn ${state.heldCarts.length ? 'p' : ''}" style="padding:3px 8px;font-size:11px" onclick="openRecallModal()" title="Recall parked carts">
            <i class="fa-solid fa-clock-rotate-left"></i> Recall ${state.heldCarts.length ? `(${state.heldCarts.length})` : ''}
          </button>
          <button class="btn" style="padding:3px 8px;font-size:11px" onclick="clearCart()" ${!ids.length ? 'disabled' : ''}>Clear</button>
        </div>
      </div>
      <div class="cust-bar">
        <div>
          <span style="color:var(--mute);font-size:10.5px;font-weight:700;display:block;text-transform:uppercase;letter-spacing:0.04em">CUSTOMER</span>
          <b style="font-size:13px">${state.customer.name}</b>
          ${state.customer.outstanding > 0 ? `
            <div>
              <span class="debt-alert">
                <i class="fa-solid fa-triangle-exclamation"></i> Debt Balance: ₦${Number(state.customer.outstanding).toLocaleString()}
              </span>
            </div>
          ` : ''}
        </div>
        <button class="btn" style="padding:4px 10px;font-size:11.5px" onclick="openCustomerModal()"><i class="fa-solid fa-user-pen"></i> Change (F4)</button>
      </div>
    </div>

    <div class="lines">${lines}</div>

    <div class="sum">
      <div class="row"><span>Subtotal (${t.n} items)</span><span>${NGN(t.sub)}</span></div>
      <div class="row">
        <span>Discount % ${state.managerApprovedBy ? `<small style="color:var(--brand);font-weight:700">(${state.managerApprovedBy})</small>` : ((!state.user || state.user.role === 'cashier') ? `<small style="color:var(--mute);font-size:10.5px;font-weight:600"><i class="fa-solid fa-lock" style="font-size:9px"></i> PIN req</small>` : '')}</span>
        <input id="disc" type="number" min="0" max="100" value="${state.disc}" onchange="handleDiscountChange(this.value)">
      </div>
      ${state.pay === 'Cash' ? `

// Complete sale & save to offline outbox
async function chargeSale() {
  const t = calcTotals();
  if (!t.n) {
    toast('Add items to the cart first.');
    return;
  }

  // Strict stock validation: block checkout if any item is out of stock or exceeds stock
  for (const id of Object.keys(state.cart)) {
    const it = getItem(id);
    if (!it) continue;
    const units = getItemUnits(it);
    const cartEntry = state.cart[id];
    const unit = units[cartEntry.unitIndex] || units[0];
    const unitRatio = getUnitRatio(unit);
    const bulkUnit = units.find(u => !u.is_base) || units[units.length - 1];
    const bulkRatio = getUnitRatio(bulkUnit);
    const rawBulk = parseFloat(it.stock) || 0;
    const maxAvailableBase = Math.round(rawBulk * bulkRatio);
    const requestedBase = cartEntry.qty * unitRatio;

    if (maxAvailableBase <= 0) {
      toast(`⛔ Checkout blocked: "${it.name}" is OUT OF STOCK. Remove it to proceed.`);
      alert(`Cannot checkout: "${it.name}" is OUT OF STOCK. Please remove it from the cart.`);
      return;
    }
    if (requestedBase > maxAvailableBase) {
      const unitName = (unit.name || unit.unit_symbol || 'units').toUpperCase();
      const maxUnitsInSelected = Math.floor(maxAvailableBase / unitRatio);
      toast(`⛔ Checkout blocked: Insufficient stock for "${it.name}". Only ${maxUnitsInSelected} ${unitName} available.`);
      alert(`Insufficient stock for "${it.name}".\nRequested: ${cartEntry.qty} ${unitName}\nAvailable: ${maxUnitsInSelected} ${unitName}`);
      return;
    }
  }

  let paymentModeDisplay = state.pay;
  let paymentArray = [];

  if (state.pay === 'Split') {
    const sc = parseFloat(state.split?.cash) || 0;
    const sm = parseFloat(state.split?.moniepoint) || 0;
    const st = parseFloat(state.split?.transfer) || 0;
    const totalAlloc = sc + sm + st;
    if (Math.abs(totalAlloc - t.total) >= 1) {
      toast(`Split amounts (₦${totalAlloc.toLocaleString()}) must match total (₦${t.total.toLocaleString()})`);
      return;
    }
    if (sc > 0) paymentArray.push({ mode: 'Cash', amount: sc });
    if (sm > 0) paymentArray.push({ mode: 'Moniepoint POS', amount: sm });
    if (st > 0) paymentArray.push({ mode: 'First Bank Transfer', amount: st });

    paymentModeDisplay = `Split (${paymentArray.map(p => `${p.mode.replace(' POS', '').replace(' Bank Transfer', '')}: ₦${p.amount.toLocaleString()}`).join(', ')})`;
  } else {
    paymentArray.push({ mode: state.pay, amount: t.total });
  }

  const lineItems = Object.keys(state.cart).map(id => {
    const L = getCartLine(id);
    return {
      item_id: L.item.id,
      name: L.item.name,
      unit: L.unit.unit_symbol || L.unit.name,
      unit_display: (L.unit.name || '').toUpperCase(),
      unit_conversion_id: L.unit.unit_conversion_id || '',
      quantity: L.qty,
      rate: L.price,
      list_price: L.listPrice,
      is_custom_price: L.price !== L.listPrice,
      total: L.total
    };
  });

  const tenderVal = parseFloat(state.tender) || 0;
  if (!state.user) {
    state.isLocked = true;
    renderLockScreen();
    toast('🔒 Login required: Please enter your cashier PIN.');
    return;
  }

  const amountPaid = tenderVal >= t.total ? tenderVal : t.total;
  const changeDue = Math.max(0, amountPaid - t.total);

  const salePayload = {
    terminal_id: state.terminalId,
    user_id: state.user.id,
    user_name: state.user.name,
    customer_id: state.customer.id,
    customer_name: state.customer.name,
    salesperson: state.user.name,
    date: new Date().toISOString().split('T')[0],
    payment_mode: paymentModeDisplay,
    payments: paymentArray,
    amount_paid: amountPaid,
    change: changeDue,
    subtotal: t.sub,
    discount: state.disc || 0,
    manager_override: !!(state.managerDiscountApproved || state.managerPriceApproved),
    manager_override_by: state.managerApprovedBy || state.managerPriceApprovedBy || null,
    total: t.total,
    line_items: lineItems
  };

  try {
    const r = await fetch('/api/sales', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(salePayload)
    });
    const res = await r.json();

    if (res.success) {
      lineItems.forEach(l => {
        const it = getItem(l.item_id);
        if (it) {
          const u = (it.units || []).find(x => (x.unit_symbol === l.unit || x.name === l.unit)) || it.units?.[0];
          const ratio = getUnitRatio(u);
          const bulkUnit = (it.units || []).find(x => !x.is_base) || it.units?.[it.units.length - 1];
          const bulkRatio = getUnitRatio(bulkUnit);
          const soldBulk = (l.quantity * ratio) / bulkRatio;
          it.stock = Math.max(0, (parseFloat(it.stock) || 0) - soldBulk);
        }
      });
      state.cart = {};
      state.disc = 0;
      state.managerDiscountApproved = false;
      state.managerApprovedBy = null;
      state.managerPriceApproved = false;
      state.managerPriceApprovedBy = null;
      state.tender = '';
      state.split = { cash: 0, moniepoint: 0, transfer: 0 };
      await loadQueueStatus();
      renderMain();
      playSound('success');

      // Direct Silent Thermal Printing & Cash Drawer Kick
      if (state.pp.printMode === 'direct') {
        doDirectPrint(res.sale);
      } else {
        showReceiptModal(res.sale);
      }
      toast(`Receipt ${res.sale.receipt_number} saved & settled.`);
    } else {
      alert('Error: ' + res.message);
    }
  } catch(e) {
    alert('Server communication error: ' + e.message);
  }
}

// Hold / Park & Recall Cart Engine
function holdCurrentCart(silent = false) {
  if (!Object.keys(state.cart).length) return;
  const totals = calcTotals();
  const held = {
    id: 'HOLD-' + Date.now().toString(36).toUpperCase(),
    time: new Date().toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' }),
    customer: { ...state.customer },
    cart: JSON.parse(JSON.stringify(state.cart)),
    disc: state.disc,
    managerDiscountApproved: state.managerDiscountApproved || false,
    managerApprovedBy: state.managerApprovedBy || null,
    managerPriceApproved: state.managerPriceApproved || false,
    managerPriceApprovedBy: state.managerPriceApprovedBy || null,
    total: totals.total,
    itemCount: totals.n
  };
  state.heldCarts.unshift(held);
  saveHeldCarts();
  state.cart = {};
  state.disc = 0;
  state.managerDiscountApproved = false;
  state.managerApprovedBy = null;
  state.managerPriceApproved = false;
  state.managerPriceApprovedBy = null;
  state.tender = '';
  state.customer = { id: '1560234000000102202', name: 'Walk in Customer' };
  renderMain();
  if (!silent) {
    toast(`🛒 Cart parked on hold (${held.itemCount} items). Next customer ready!`);
    playSound('beep');
  }
}

function resumeHeldCart(idx) {
  const held = state.heldCarts[idx];
  if (!held) return;

  const currentHasItems = Object.keys(state.cart).length > 0;
  if (currentHasItems) {
    if (!confirm('The current cart has items. Park the current cart first before resuming this one?')) {
      return;
    }
    holdCurrentCart(true); // silent park
  }

  state.cart = JSON.parse(JSON.stringify(held.cart));
  state.customer = { ...held.customer };
  state.disc = held.disc || 0;
  state.managerDiscountApproved = held.managerDiscountApproved || false;
  state.managerApprovedBy = held.managerApprovedBy || null;
  state.managerPriceApproved = held.managerPriceApproved || false;
  state.managerPriceApprovedBy = held.managerPriceApprovedBy || null;
  state.tender = '';
  state.heldCarts.splice(idx, 1);
  saveHeldCarts();
  closeModal();
  renderMain();
  toast(`🛒 Resumed cart for ${state.customer.name}!`);
  playSound('beep');
}

function deleteHeldCart(idx) {
  if (confirm('Discard this held cart?')) {
    state.heldCarts.splice(idx, 1);
    saveHeldCarts();
    if (state.heldCarts.length) openRecallModal();
    else closeModal();
    renderMain();
  }
}

function clearAllHeldCarts() {
  if (confirm('Discard all parked carts?')) {
    state.heldCarts = [];
    saveHeldCarts();
    closeModal();
    renderMain();
    toast('All held carts cleared.');
  }
}

// Sync to Zoho (Push Pending Sales)
async function triggerSync() {
  if (state.syncing) return;
  state.syncing = true;
  renderTop();
  renderMain();

  try {
    const r = await fetch('/api/sync', { method: 'POST' });
    const res = await r.json();
    alert(res.message);
    await loadQueueStatus();
  } catch(e) {
    alert('Sync error: ' + e.message);
  } finally {
    state.syncing = false;
    renderTop();
    renderMain();
  }
}

// Pull from Zoho (Customers & Live Inventory)
async function triggerPullSync() {
  if (state.pulling) return;
  state.pulling = true;
  renderTop();
  renderMain();

  try {
    const r = await fetch('/api/sync/pull', { method: 'POST' });
    const res = await r.json();
    if (res.success) {
      await loadCatalog();
      await loadCustomers();
      renderMain();
      alert('✅ ' + (res.message || 'Synced customers & inventory successfully!'));
    } else {
      alert('⚠️ ' + (res.message || 'Failed to pull from Zoho'));
    }
  } catch(e) {
    alert('Pull Sync error: ' + e.message);
  } finally {
    state.pulling = false;
    renderTop();
    renderMain();
  }
}

      state.installedPrinters = res.printers;
    }
  } catch(e) {
    console.warn('Printer discovery:', e);
  }
}

async function openCashDrawer() {
  try {

    const targetPrinter = state.pp.printer === 'System default printer' ? '' : state.pp.printer;
    const r = await fetch('/api/hardware/open-drawer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ printer_name: targetPrinter })
    });
    const res = await r.json();
    if (res.success) {
      playSound('beep');
      toast('Cash drawer popped open.');
    } else {
      toast('Drawer alert: ' + (res.message || 'Check printer connection'));
    }
  } catch(e) {
    toast('Error opening drawer: ' + e.message);
  }
}

async function doDirectPrint(sale) {
  try {
    const isCash = (sale.payment_mode === 'CASH' || (sale.payments && sale.payments.some(p => (p.mode || '').toLowerCase() === 'cash')));
    const targetPrinter = state.pp.printer === 'System default printer' ? '' : state.pp.printer;
    const r = await fetch('/api/hardware/print', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sale: sale,
        printer_name: targetPrinter,
        paper: state.pp.paper || '80',
        open_drawer: state.pp.autoKickDrawer !== false && isCash
      })
    });
    const res = await r.json();
    if (res.success) {
      toast(`Direct thermal receipt printed (${sale.receipt_number || sale.order_id}).`);
    } else {
      console.warn('Silent print note:', res.message);
      toast('Direct print: ' + (res.message || 'Printer not responding'));
    }
  } catch(e) {
    console.warn('Silent print error:', e);
    toast('Silent print error: ' + e.message);
  }
}

function previewPrintReceipt(saleId) {
  const sale = state.sales.find(s => s.id === saleId);

function updatePrintPref(key, val) {
  state.pp[key] = val;
  savePrefs();
  if (state.activePrintSale) {
    $('#pv').innerHTML = tickHTML(state.activePrintSale, state.pp);
  }
}

async function doPrint(forceBrowser = false) {
  const s = state.activePrintSale;
  if (!s) return;
  const p = state.pp;

  // Silent Direct Print via ESC/POS Spooler
  if (p.printMode === 'direct' && !forceBrowser) {
    closeModal();
    await doDirectPrint(s);
    return;
  }

  // Fallback to standard Browser Print Dialog
  $('#pgs').textContent = '@page{margin:0;size:' + (p.paper === 'A4' ? 'A4' : p.paper + 'mm auto') + '}';
  $('#prt').innerHTML = Array(parseInt(p.copies, 10) || 1).fill(tickHTML(s, p)).join('');
  closeModal();
  setTimeout(() => window.print(), 60);
}

async function refreshBackupsList() {
  try {
    const r = await fetch('/api/backups');
    const res = await r.json();
    const listEl = $('#backup-list');
    if (!listEl) return;
    if (!res.success || !res.backups || !res.backups.length) {
      listEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--mute);font-size:12.5px">No backups created yet. Click <b>Backup Now</b> to create one.</div>`;
      return;
    }
    listEl.innerHTML = res.backups.map(b => {
      const dateStr = new Date(b.created_at).toLocaleString();
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)">
          <div>
            <div style="font-weight:700;font-size:13px;color:var(--ink)"><i class="fa-solid fa-file-zipper" style="color:var(--brand);margin-right:6px"></i>${b.filename}</div>
            <div style="font-size:11px;color:var(--mute)">Created: ${dateStr} · Size: <b>${b.size_formatted}</b></div>
          </div>
          <a href="${b.download_url}" download class="btn" style="text-decoration:none;font-size:12px;padding:5px 12px;display:flex;align-items:center;gap:6px">
            <i class="fa-solid fa-download"></i> Download .ZIP
          </a>
        </div>
      `;
    }).join('');
  } catch(e) {
    const listEl = $('#backup-list');
    if (listEl) listEl.innerHTML = `<div style="padding:16px;color:var(--bad)">Error loading backups: ${e.message}</div>`;
  }
}

async function triggerManualBackup() {
  const btn = $('#btn-backup-now');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Backing up...`;
  }
  try {
    const r = await fetch('/api/backup/now', { method: 'POST' });
    const res = await r.json();
    if (res.success) {
      toast(`Backup snapshot created successfully! (${res.size_formatted})`);
      playSound('success');
      await refreshBackupsList();
    } else {
      alert('Backup failed: ' + (res.message || 'Unknown error'));
    }
  } catch(e) {
    alert('Error connecting to server: ' + e.message);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Backup Now`;
    }
  }
}

function toggleNewCustForm() {
  const box = $('#new-cust-box');
  if (!box) return;
  const isHidden = box.style.display === 'none';

async function submitNewCust() {
  const name = ($('#nc-name')?.value || '').trim();
  const phone = ($('#nc-phone')?.value || '').trim();
  if (!name) {
    alert('Please enter a customer or company name.');
    return;
  }
  try {
    const r = await fetch('/api/customers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone })
    });
    const res = await r.json();
    if (res.success && res.customer) {
      const c = res.customer;
      // Add or replace in state.customers
      const idx = state.customers.findIndex(x => x.id === c.id || x.name.toLowerCase() === c.name.toLowerCase());
      if (idx >= 0) {
        state.customers[idx] = c;
      } else {
        state.customers.unshift(c);
      }
      state.customer = { id: c.id, name: c.display_name || c.name, outstanding: c.outstanding || 0 };
      closeModal();
      renderMain();
      toast(`✅ Customer registered & selected: ${state.customer.name}`);
    } else {
      alert('Error: ' + (res.message || 'Failed to save customer'));
    }
  } catch(e) {
    alert('Failed to register customer: ' + e.message);
  }
}

function renderCustRows(list) {
  return list.slice(0, 50).map(c => `
    <div class="cust-bar" style="cursor:pointer;padding:8px 10px;border-radius:6px;margin-bottom:4px" onclick="pickCustomer('${c.id}')">
      <div>
        <b style="font-size:13px">${c.display_name || c.name}</b>
        <span style="display:block;font-size:11px;color:var(--mute)">${c.phone ? '📞 ' + c.phone : ''} ${c.company_name ? '• ' + c.company_name : ''}</span>
      </div>
      <div style="text-align:right">
        ${c.outstanding > 0 ? `
          <span style="color:#c92a2a;background:#ffe3e3;font-weight:700;font-size:11px;padding:2px 6px;border-radius:4px;display:inline-block;margin-bottom:2px">
            Debt: ₦${Number(c.outstanding).toLocaleString()}
          </span><br>
        ` : ''}
        ${c.id === state.customer.id ? '<span class="pill" style="padding:2px 6px;font-size:10px">Selected</span>' : ''}
      </div>
    </div>
  `).join('');
}

function filterCustList(q) {
  const query = q.toLowerCase().trim();
  const filtered = state.customers.filter(c =>
    (c.display_name && c.display_name.toLowerCase().includes(query)) ||
    (c.name && c.name.toLowerCase().includes(query)) ||
    (c.company_name && c.company_name.toLowerCase().includes(query)) ||
    (c.phone && c.phone.includes(query))
  );
  $('#cust-modal-list').innerHTML = renderCustRows(filtered);
}

function pickCustomer(id) {
  const c = state.customers.find(x => x.id === id);
  if (c) {
    state.customer = { id: c.id, name: c.display_name || c.name, outstanding: c.outstanding || 0 };
    closeModal();
    renderMain();
    toast('Customer set to ' + state.customer.name + (c.outstanding > 0 ? ` (Debt: ₦${Number(c.outstanding).toLocaleString()})` : ''));
  }
}

function searchPM(q) {
  const query = q.toLowerCase().trim();
  const div = $('#pm-results');
  if (!query) { div.innerHTML = ''; return; }
  const matches = state.items.filter(it => it.name.toLowerCase().includes(query)).slice(0, 6);
  div.innerHTML = matches.map(m => `
    <div class="cust-bar" style="cursor:pointer" onclick="selectPMItem('${m.id}')">
      <b>${m.name}</b>
      <span style="font-size:11.5px;color:var(--mute)">Single: ${NGN(m.retail_price)} • Carton: ${NGN(m.carton_price)}</span>
    </div>
  `).join('');

function selectPMItem(id) {
  const it = getItem(id);
  if (!it) return;
  activePMItem = it;
  $('#pm-name').innerText = it.name;
  $('#pm-retail').value = it.retail_price;
  $('#pm-carton').value = it.carton_price;
  $('#pm-editor').style.display = 'block';
}

async function savePriceUpdate() {
  if (!activePMItem) return;
  const retail = parseFloat($('#pm-retail').value) || 0;
  const carton = parseFloat($('#pm-carton').value) || 0;

  try {
    const r = await fetch('/api/catalog/update-price', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        item_id: activePMItem.id,
        retail_price: retail,
        carton_price: carton,
        user_role: state.user?.role || 'cashier',
        manager_pin: activePMManagerAuth ? activePMManagerAuth.pin : undefined
      })
    });
    const res = await r.json();
    if (res.success) {
      activePMItem.retail_price = retail;
      activePMItem.carton_price = carton;
      if (activePMItem.units && activePMItem.units.length) {
        const b = activePMItem.units.find(u => u.is_base);
        if (b) b.price = retail;
        const c = activePMItem.units.find(u => !u.is_base);
        if (c) c.price = carton;
      }
      closeModal();
      renderMain();
      toast(`✅ Prices updated for ${activePMItem.name}`);
    } else {
      alert('Error: ' + res.message);
    }
  } catch(e) {
    alert('Failed to update price: ' + e.message);
  }
}

async function renameAccountPrompt(userId, currentName) {
  const newName = prompt(`Enter new account name for "${currentName}":\n(This will be your Order ID prefix on receipts and Zoho, e.g. ${currentName.toUpperCase()}-0001)`, currentName);
  if (!newName || !newName.trim() || newName.trim() === currentName) return;

  try {
    const res = await fetch('/api/auth/update-name', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, name: newName.trim() })
    }).then(r => r.json());

    if (res.success) {
      if (state.user && state.user.id === userId) {
        state.user.name = res.user.name;
        sessionStorage.setItem('pos_user', JSON.stringify(state.user));
      }
      toast(`✅ Account renamed to "${res.user.name}"`);
      openAccountsModal();
      renderTop();
    } else {
      alert('Error: ' + res.message);
    }
  } catch(e) {
    alert('Failed to update name: ' + e.message);
  }
}

async function changePinPrompt(userId, userName) {
  const oldPin = prompt(`Enter CURRENT 4-digit PIN for ${userName}:`);
  if (!oldPin) return;
  const newPin = prompt(`Enter NEW 4-digit PIN for ${userName}:`);
  if (!newPin || newPin.length !== 4 || isNaN(newPin)) {
    alert('PIN must be exactly 4 digits.');
    return;
  }

  try {
    const res = await fetch('/api/auth/change-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, old_pin: oldPin.trim(), new_pin: newPin.trim() })
    }).then(r => r.json());

    if (res.success) {
      alert(`✅ ${res.message}`);
      openAccountsModal();
    } else {
      alert('Error: ' + res.message);
    }
  } catch(e) {
    alert('Failed to update PIN: ' + e.message);
  }
}

// MANAGER PIN OVERRIDE FOR DISCOUNTS & PRICE CHANGES
// ====================================================
function handleDiscountChange(val) {
  const num = Math.min(100, Math.max(0, parseFloat(val) || 0));
  if (num === 0) {
    state.disc = 0;
    state.managerDiscountApproved = false;
    state.managerApprovedBy = null;
    $('#cart').innerHTML = renderCartHTML();
    return;
  }

  // Manager or Finance logged in directly can apply discounts
  if (state.user && (state.user.role === 'admin' || state.user.role === 'finance' || state.user.role === 'manager')) {
    state.disc = num;
    state.managerDiscountApproved = true;
    state.managerApprovedBy = `${state.user.name} (${state.user.role.toUpperCase()})`;
    $('#cart').innerHTML = renderCartHTML();
    return;
  }

  // If cashier already got manager/finance approval for this cart with same or higher discount
  if (state.managerDiscountApproved && state.disc >= num) {
    state.disc = num;
    $('#cart').innerHTML = renderCartHTML();
    return;
  }

  // Cashier cannot apply discount without manager or finance pin
  openManagerOverrideModal({
    reason: `Cashiers cannot apply discounts without Manager or Finance PIN. Authorize ${num}% discount?`,
    onApprove: (manager) => {
      state.disc = num;
      state.managerDiscountApproved = true;
      state.managerApprovedBy = `${manager.name} (${manager.role.toUpperCase()})`;
      toast(`✅ Discount (${num}%) authorized by ${manager.name}.`);
      playSound('beep');
      $('#cart').innerHTML = renderCartHTML();
    },
    onReject: () => {
      state.disc = 0;
      state.managerDiscountApproved = false;
      state.managerApprovedBy = null;
      toast('❌ Discount denied: Cashiers cannot apply discounts without Manager or Finance PIN.');
      $('#cart').innerHTML = renderCartHTML();
    }
  });
}

function openManagerOverrideModal({ reason, onApprove, onReject }) {
  let pinBuf = '';

  function renderModal() {
    $('#ov').innerHTML = `

          <div style="width:56px;height:56px;border-radius:50%;background:rgba(239,68,68,0.1);color:var(--bad);display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px">

          <p style="margin:0 0 16px;color:var(--mute);font-size:13px">${reason || 'Authorization required for this action.'}</p>

          <div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px">

            <div style="font-family:monospace;font-size:28px;letter-spacing:10px;font-weight:700;color:var(--ink);min-height:36px">

          </div>

          <div class="pin-pad" style="max-width:280px;margin:0 auto 16px">
            ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="pin-btn" onclick="managerPinDigit('${n}')">${n}</button>`).join('')}

            <button class="btn" style="flex:1" onclick="cancelManagerOverride()">Cancel</button>

          </div>
        </div>
      </div>
    `;
  }

  window.managerPinDigit = (d) => {
    if (pinBuf.length < 6) {
      pinBuf += d;
      playSound('beep');
      renderModal();
      if (pinBuf.length === 4) {
        setTimeout(submitManagerOverride, 150);
      }
    }
  };

  window.managerPinClear = () => {
    pinBuf = '';
    renderModal();
  };

  window.managerPinDel = () => {
    pinBuf = pinBuf.slice(0, -1);
    renderModal();
  };

  window.cancelManagerOverride = () => {
    closeModal();
    if (typeof onReject === 'function') onReject();
  };

  window.submitManagerOverride = async () => {
    if (!pinBuf) return;
    try {
      const r = await fetch('/api/users/verify-manager-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pinBuf })
      });
      const res = await r.json();
      if (res.success && res.manager) {

      } else {

        alert(res.message || 'Invalid Manager PIN.');
        pinBuf = '';

      alert('Error verifying PIN: ' + e.message);

    if (res && res.success && res.active_shift) {
      activeShift = res.active_shift;
    }

  // If no active shift, offer to start one

  const shiftStart = new Date(activeShift.opened_at);
  const shiftSales = queue.filter(s => {
    const d = new Date(s.created_at || s.date);
    return d >= shiftStart && (!s.terminal_id || s.terminal_id === term);

function recalcZReportVariance(expectedCash) {
  const counted = parseFloat($('#counted-cash')?.value) || 0;
  const pill = $('#variance-pill');
  if (!pill) return;
  const diff = counted - expectedCash;
  if (diff === 0) {
    pill.style.background = 'rgba(34,197,94,0.15)';
    pill.style.color = '#15803d';
    pill.textContent = '✅ BALANCED (₦0.00)';
  } else if (diff > 0) {
    pill.style.background = 'rgba(234,179,8,0.15)';
    pill.style.color = '#a16207';
    pill.textContent = `⚠️ OVER (+${NGN(diff)})`;
  } else {
    pill.style.background = 'rgba(239,68,68,0.15)';
    pill.style.color = '#b91c1c';
    pill.textContent = `❌ SHORT (${NGN(diff)})`;
  }
}

function calcDenominations(expectedCash) {
  const n1000 = (parseInt($('#d1000')?.value, 10) || 0) * 1000;
  const n500 = (parseInt($('#d500')?.value, 10) || 0) * 500;
  const n200 = (parseInt($('#d200')?.value, 10) || 0) * 200;
  const n100 = (parseInt($('#d100')?.value, 10) || 0) * 100;
  const total = n1000 + n500 + n200 + n100;
  const countedInput = $('#counted-cash');
  if (countedInput) {
    countedInput.value = total;
    recalcZReportVariance(expectedCash);
  }
}

async function printShiftZReport() {
  if (!currentShiftData) return;
  const counted = parseFloat($('#counted-cash')?.value) || currentShiftData.expected_cash;
  const report = {
    ...currentShiftData,
    counted_cash: counted,
    variance: counted - currentShiftData.expected_cash
  };

  // Direct Thermal Printing if configured
  if (state.pp.printMode === 'direct') {
    try {
      toast('Sending Z-Report to thermal receipt printer...');
      const r = await fetch('/api/hardware/print-zreport', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          report: report,
          printer_name: state.pp.printer === 'System default printer' ? '' : state.pp.printer,
          paper: state.pp.paper || '80'
        })
      });
      const res = await r.json();
      if (res.success) {
        toast('Z-Report printed successfully on thermal printer!');
        playSound('beep');
        return;
      }
    } catch(e) {
      console.warn('Silent Z-report print failed, falling back to browser print:', e);
    }
  }

  // Fallback to Browser Print
  $('#pgs').textContent = '@page{margin:0;size:' + (state.pp.paper === 'A4' ? 'A4' : state.pp.paper + 'mm auto') + '}';
  $('#prt').innerHTML = tickZReportHTML(report, state.pp);
  setTimeout(() => window.print(), 60);
}

async function finalizeShiftClose() {
  if (!currentShiftData) return;
  const countedVal = $('#counted-cash')?.value;
  if (countedVal === undefined || countedVal === '') {
    alert('Please count physical cash in drawer and enter the amount before closing shift.');
    $('#counted-cash')?.focus();
    return;
  }

  const counted = parseFloat(countedVal) || 0;
  const diff = counted - currentShiftData.expected_cash;
  const diffStr = diff === 0 ? 'BALANCED (₦0.00)' : (diff > 0 ? `OVER +${NGN(diff)}` : `SHORT ${NGN(diff)}`);

  if (!confirm(`Are you sure you want to CLOSE this shift?\n\nExpected Cash: ${NGN(currentShiftData.expected_cash)}\nCounted Cash:  ${NGN(counted)}\nVariance:      ${diffStr}\n\nThis will finalize the Z-Report and log you out.`)) {
    return;
  }

  try {
    const r = await fetch('/api/shifts/close', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        terminal_id: currentShiftData.terminal_id,
        cashier_id: currentShiftData.cashier_id,
        cashier_name: currentShiftData.cashier_name,
        counted_cash: counted
      })
    });
    const res = await r.json();
    if (res.success) {
      toast('Shift closed successfully! Z-Report archived.');
      playSound('success');
      currentShiftData = res.report;
      printShiftZReport();
      closeModal();
      // Lock register to PIN screen for next cashier
      setTimeout(lockRegister, 500);
    } else {
      alert('Error closing shift: ' + res.message);
    }
  } catch(e) {
    alert('Error communicating with server: ' + e.message);
  }
}

async function openZReportHistoryModal() {
  $('#ov').innerHTML = `
    <div class="ov">
      <div class="modal" style="width:640px;max-height:85vh;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px">
          <h3 style="margin:0"><i class="fa-solid fa-clock-rotate-left" style="color:var(--brand)"></i> Shift History & Z-Reports</h3>
          <button class="rs" onclick="openShiftCloseModal()">✕</button>
        </div>
        <div id="z-history-list" style="flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)">
          <div style="padding:20px;text-align:center;color:var(--mute)">Loading previous Z-Reports...</div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:12px">
          <button class="btn" onclick="openShiftCloseModal()">Back to Active Shift</button>
        </div>
      </div>
    </div>
  `;

  try {
    const r = await fetch('/api/shifts/history');
    const res = await r.json();
    const listEl = $('#z-history-list');
    if (!listEl) return;
    if (!res.success || !res.reports || !res.reports.length) {
      listEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--mute)">No previous shift reports on record yet.</div>`;
      return;
    }
    listEl.innerHTML = res.reports.map(rep => {
      const isBal = rep.variance === 0;
      const varColor = isBal ? '#15803d' : (rep.variance > 0 ? '#a16207' : '#b91c1c');
      const varText = isBal ? 'Balanced (₦0.00)' : (rep.variance > 0 ? `Over (+${NGN(rep.variance)})` : `Short (${NGN(rep.variance)})`);
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)">
          <div>
            <div style="font-weight:700;font-size:13px;color:var(--ink)">
              ${rep.report_id} · <span style="color:var(--brand)">${rep.cashier_name}</span> (${rep.terminal_id})
            </div>
            <div style="font-size:11px;color:var(--mute)">
              Closed: ${rep.closed_at} · Sales: <b>${rep.total_sales}</b> · Gross: <b>${NGN(rep.gross_revenue)}</b>
            </div>
            <div style="font-size:11.5px;font-weight:700;color:${varColor};margin-top:2px">
              Variance: ${varText} (Counted: ${NGN(rep.counted_cash)} / Expected: ${NGN(rep.expected_cash)})
            </div>
          </div>
          <button class="btn" onclick='currentShiftData=${JSON.stringify(rep)};printShiftZReport()' style="font-size:12px;padding:4px 10px">
            <i class="fa-solid fa-print"></i> Re-print
          </button>
        </div>
      `;
    }).join('');
  } catch(e) {
    const listEl = $('#z-history-list');
    if (listEl) listEl.innerHTML = `<div style="padding:16px;color:var(--bad)">Failed loading history: ${e.message}</div>`;
  }
}
