<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quality Superstores POS - Retail Register</title>
<link rel="icon" type="image/x-icon" href="/pos_icon.ico">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/pos_icon_192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #F4F6F9;
  --panel: #FFFFFF;
  --panel-alt: #F8FAFC;
  --ink: #0F172A;
  --mute: #64748B;
  --line: #E2E8F0;
  --line-light: #F1F5F9;
  --brand: #059669;
  --brand-hover: #047857;
  --brand-glow: rgba(5, 150, 105, 0.22);
  --on: #FFFFFF;
  --soft: #ECFDF5;
  --warn: #D97706;
  --warnbg: #FEF3C7;
  --bad: #DC2626;
  --badbg: #FEE2E2;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.03);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B0F17;
    --panel: #131B2A;
    --panel-alt: #182234;
    --ink: #F8FAFC;
    --mute: #94A3B8;
    --line: #222F43;
    --line-light: #1A2435;
    --brand: #10B981;
    --brand-hover: #34D399;
    --brand-glow: rgba(16, 185, 129, 0.25);
    --on: #041B12;
    --soft: rgba(16, 185, 129, 0.14);
    --warn: #F59E0B;
    --warnbg: rgba(245, 158, 11, 0.16);
    --bad: #EF4444;
    --badbg: rgba(239, 68, 68, 0.16);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
    --shadow-lg: 0 12px 24px rgba(0,0,0,0.45);
    --shadow-card: 0 2px 6px rgba(0,0,0,0.25);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0F17;
  --panel: #131B2A;
  --panel-alt: #182234;
  --ink: #F8FAFC;
  --mute: #94A3B8;
  --line: #222F43;
  --line-light: #1A2435;
  --brand: #10B981;
  --brand-hover: #34D399;
  --brand-glow: rgba(16, 185, 129, 0.25);
  --on: #041B12;
  --soft: rgba(16, 185, 129, 0.14);
  --warn: #F59E0B;
  --warnbg: rgba(245, 158, 11, 0.16);
  --bad: #EF4444;
  --badbg: rgba(239, 68, 68, 0.16);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 24px rgba(0,0,0,0.45);
  --shadow-card: 0 2px 6px rgba(0,0,0,0.25);
}

*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  overflow: hidden;
  font-variant-numeric: tabular-nums;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

input, select, textarea { -webkit-user-select: text; user-select: text; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; transition: all 0.15s ease; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Custom scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--mute); }

.app {
  height: 100%;
  min-width: 960px;
  display: grid;
  grid-template-rows: 58px 1fr 38px 28px;
}

/* Modern Top Header */
.top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.02em;
}

.mark {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, #059669 0%, #10B981 100%);
  color: #FFFFFF;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 16px;
  box-shadow: 0 2px 8px var(--brand-glow);
}

.reg-sel {
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 8px;
  padding: 6px 12px;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}
.reg-sel:hover {
  border-color: var(--brand);
  background: var(--panel);
  box-shadow: 0 0 0 2px var(--brand-glow);
}

.sp { flex: 1; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 99px;
  font-weight: 700;
  font-size: 11.5px;
  background: var(--soft);
  color: var(--brand);
  border: 1px solid rgba(5, 150, 105, 0.15);
}

.pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
  animation: pulse-dot 2s infinite;
}

.pill.off {
  background: var(--badbg);
  color: var(--bad);
  border-color: rgba(220, 38, 38, 0.2);
}
.pill.off i { animation: none; }

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}

.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 8px;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink);
  font-weight: 700;
  font-size: 12px;
}
.user-chip i { color: var(--brand); font-size: 14px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 8px;
  padding: 6px 12px;
  font-weight: 600;
  font-size: 12.5px;
  box-shadow: var(--shadow-sm);
}
.btn:hover {
  background: var(--bg);
  border-color: var(--mute);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }

.btn.p {
  background: linear-gradient(135deg, #059669 0%, #10B981 100%);
  color: #FFFFFF;
  border-color: transparent;
  box-shadow: 0 2px 6px var(--brand-glow);
}
.btn.p:hover {
  filter: brightness(1.06);
  box-shadow: 0 4px 12px var(--brand-glow);
}
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

.btn.icon-btn {
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 8px;
}

.spin {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: r .8s linear infinite;
  vertical-align: -2px;
  margin-right: 6px;
}
@keyframes r { to { transform: rotate(360deg); } }

/* Body Layout */
.body {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 0;
}

/* Modern Left Nav */
.nav {
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
}

.nav button {
  display: flex;
  align-items: center;
  gap: 9px;
  text-align: left;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mute);
  border: 1px solid transparent;
  background: none;
  position: relative;
  transition: all 0.15s ease;
  cursor: pointer;
}
.nav button:hover {
  background: var(--bg);
  color: var(--ink);
}
.nav button.on {
  background: var(--soft);
  color: var(--brand);
  border-color: rgba(5, 150, 105, 0.2);
  font-weight: 700;
}

.nav .gl {
  display: block;
  color: var(--mute);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 6px 10px 4px;
  letter-spacing: .06em;
}

.nav kbd, .sb kbd {
  margin-left: auto;
  font: 700 10.5px 'Plus Jakarta Sans', system-ui, sans-serif;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--mute);
  background: var(--bg);
}

.badge {
  position: static;
  margin-left: auto;
  background: var(--warn);
  color: #FFFFFF;
  border-radius: 99px;
  font-size: 11px;
  padding: 1px 8px;
  font-weight: 800;
}

.nb {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  background: var(--panel-alt);
  border-radius: 10px;
  padding: 12px;
  border: 1px solid var(--line);
}
.nb .row {
  padding: 4px 0;
  font-size: 11.5px;
  color: var(--mute);
  display: flex;
  justify-content: space-between;
}
.nb .row b { color: var(--ink); }

/* Main Sell Screen */
.sell {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(420px, 32vw, 480px);
  min-height: 0;
  background: var(--bg);
}

.left {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 14px 18px 0;
}

.tools {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 10px;
}

.search-wrap {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

.search-ico {
  position: absolute;
  left: 14px;
  color: var(--mute);
  font-size: 13px;
  pointer-events: none;
}

.search-kbd {
  position: absolute;
  right: 12px;
  pointer-events: none;
}
.search-kbd kbd {
  font: 700 10.5px 'Plus Jakarta Sans', system-ui, sans-serif;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 6px;
  color: var(--mute);
  background: var(--panel);
}

.search {
  width: 100%;
  border: 1.5px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 10px 42px 10px 38px;
  font-size: 13px;
  color: var(--ink);
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}
.search:focus {
  border-color: var(--brand);
  background: var(--panel);
  box-shadow: 0 0 0 3px var(--brand-glow);
  outline: none;
}

.cat-select {
  border: 1.5px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 9px 12px;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--ink);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
  min-width: 145px;
  max-width: 175px;
}
.cat-select:hover, .cat-select:focus {
  border-color: var(--brand);
  outline: none;
  box-shadow: 0 0 0 2px var(--brand-glow);
}

.cat-tag {
  font-size: 9.5px;
  font-weight: 800;
  padding: 1.5px 6px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--h) 14%, var(--panel));
  color: color-mix(in srgb, var(--h) 80%, var(--ink));
  letter-spacing: 0.03em;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1.2;
}

.seg {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--panel);
  box-shadow: var(--shadow-sm);
}
.seg button {
  border: 0;
  background: transparent;
  padding: 7px 12px;
  font-weight: 700;
  font-size: 12px;
  color: var(--mute);
  display: flex;
  align-items: center;
  gap: 5px;
}
.seg button.on {
  background: var(--soft);
  color: var(--brand);
}

/* Product Cards Grid */
.grid {
  overflow: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(162px, 1fr));
  gap: 12px;
  align-content: start;
  padding: 2px 2px 18px;
}
.grid.list { display: block; padding: 0 0 14px; }

.tile {
  text-align: left;
  border: 1.5px solid var(--line);
  background: var(--panel);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  transition: all 0.18s ease;
  box-shadow: var(--shadow-card);
}
.tile:hover {
  border-color: var(--brand);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.tile.out { opacity: .45; cursor: not-allowed; }
.tile.out:hover { transform: none; border-color: var(--line); box-shadow: var(--shadow-card); }

.art {
  height: 56px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 19px;
  background: color-mix(in srgb, var(--h) 15%, var(--panel));
  color: color-mix(in srgb, var(--h) 75%, var(--ink));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
}

.tile b {
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.35;
  min-height: 34px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--ink);
}

.tile .m {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--mute);
  font-size: 11.5px;
  gap: 6px;
}
.tile .m span:first-child {
  color: var(--ink);
  font-weight: 800;
  font-size: 13.5px;
}

.stock-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 99px;
  font-size: 10.5px;
  font-weight: 700;
  white-space: nowrap;
}
.stock-pill.in { background: var(--soft); color: var(--brand); }
.stock-pill.low { background: var(--warnbg); color: var(--warn); }
.stock-pill.out { background: var(--badbg); color: var(--bad); }

.us {
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 11.5px;
  font-weight: 600;
  width: 100%;
  cursor: pointer;
}
.us:focus { border-color: var(--brand); outline: none; }

/* Table View */
.pt {
  width: 100%;
  table-layout: fixed;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--panel);
  border-radius: 10px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.pt th, .pt td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.pt th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--panel);
  color: var(--mute);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.pt td.td-name {
  white-space: normal;
  word-break: break-word;
  line-height: 1.3;
}
.pt th.col-act, .pt td.col-act {
  position: sticky;
  right: 0;
  z-index: 3;
  background: var(--panel);
  text-align: right;
  box-shadow: -3px 0 6px rgba(0,0,0,0.05);
}
.pt tr:hover td.col-act {
  background: var(--soft);
}
.pr { cursor: pointer; transition: background 0.12s; }
.pr:hover td { background: var(--soft); }
.pr.out { opacity: .45; cursor: not-allowed; }

.av {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  margin-right: 8px;
  font-weight: 800;
  font-size: 11px;
  vertical-align: middle;
  background: color-mix(in srgb, var(--h) 15%, var(--panel));
  color: color-mix(in srgb, var(--h) 75%, var(--ink));
}

/* Right Cart Panel */
.cart {
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  box-shadow: -2px 0 8px rgba(0,0,0,0.02);
}

.cart-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cust-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12.5px;
  transition: all 0.15s ease;
}
.cust-bar:hover { border-color: var(--brand); }
.cust-bar b {
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 240px;
  font-weight: 700;
}

.debt-alert {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #DC2626;
  background: #FEE2E2;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 4px;
  margin-top: 3px;
  border: 1px solid rgba(220, 38, 38, 0.2);
}

.lines {
  flex: 1;
  overflow: auto;
  padding: 4px 18px;
}

.empty {
  color: var(--mute);
  padding: 50px 14px;
  text-align: center;
  line-height: 1.6;
  font-size: 13px;
}

.cart-col-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1.5px solid var(--line);
  font-size: 10.5px;
  font-weight: 800;
  color: var(--mute);
  letter-spacing: .06em;
  user-select: none;
}
.cart-col-hdr .c-item { flex: 1; min-width: 0; }
.cart-col-hdr .c-unit { width: 72px; }
.cart-col-hdr .c-qty { width: 74px; text-align: center; }
.cart-col-hdr .c-tot { width: 80px; text-align: right; }
.cart-col-hdr .c-act { width: 24px; }

.ln {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  min-height: 42px;
  transition: background 0.12s;
}
.ln:hover { background: var(--line-light); border-radius: 6px; padding-left: 4px; padding-right: 4px; }

.ln .nm {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--ink);
}

.ln .us-cart {
  width: 72px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 6px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 6px;
  flex-shrink: 0;
}
.ln .us-cart:disabled { opacity: .6; cursor: default; }

/* Remove browser number stepper spinners across POS */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { 
  -webkit-appearance: none; 
  margin: 0; 
}
input[type=number] {
  -moz-appearance: textfield;
  appearance: textfield;
}

.ln .qty {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  flex-shrink: 0;
  height: 28px;
  background: var(--bg);
  overflow: hidden;
}
.qty button {
  border: 0;
  background: none;
  width: 24px;
  height: 28px;
  font-size: 14px;
  font-weight: 700;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--ink);
  transition: all 0.1s;
}
.qty button:hover {
  background: var(--soft);
  color: var(--brand);
}
.qty .qty-inp {
  width: 38px;
  height: 28px;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: inherit;

.modal h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }

.pdl {

.pdl label {

.pdl select, .pdl input {

.pv {

}
.paper {

.rc {

}
.rc .rc-c, .rc .c { text-align: center; }
.rc .rc-r, .rc .r { display: flex; justify-content: space-between; gap: 8px; line-height: 1.35; }
.rc hr, .rc .rc-hr { border: 0; border-top: 1.5px dashed #000; margin: 6px 0; }
.rc .rc-b, .rc .b { font-weight: 700; }
.rc.w80 { width: 100%; font-size: 13.5px; }

#prt { display: none; }

  .rc.w80 { width: 76mm !important; margin: 0 auto !important; padding: 0 0 2mm 0 !important; font-size: 14px !important; }

#toast {

.pin-card {

}

.pdot {

.pin-btn {

@keyframes pin-shake {

}
.shake { animation: pin-shake 0.4s ease; }

<body>
<div class="app">
  <header class="top" id="top"></header>
  <div class="body">
    <nav class="nav" id="nav"></nav>
    <main id="main" style="min-height:0;display:flex;flex-direction:column"></main>
  </div>

  <div class="fk" aria-label="Function keys">
    <button data-a="fk" data-k="F1"><kbd>F1</kbd>Help</button>
    <button data-a="fk" data-k="F2"><kbd>F2</kbd>Search</button>
    <button data-a="fk" data-k="F3"><kbd>F3</kbd>Sell / Orders</button>
    <button data-a="fk" data-k="F4"><kbd>F4</kbd>Customer</button>
    <button data-a="fk" data-k="F5" onclick="handleHoldRecallKey()"><kbd>F5</kbd>Hold / Recall</button>
    <button data-a="fk" data-k="F6"><kbd>F6</kbd>Payment</button>
    <button data-a="fk" data-k="F7"><kbd>F7</kbd>Price Manager</button>
    <button data-a="fk" data-k="F8"><kbd>F8</kbd>Charge</button>
    <button data-a="fk" data-k="F9"><kbd>F9</kbd>Sync</button>
    <button data-a="fk" data-k="F10"><kbd>F10</kbd>Theme</button>
    <button data-a="fk" data-k="F11" onclick="openCashDrawer()"><kbd>F11</kbd>Drawer</button>
    <button data-a="fk" data-k="F12"><kbd>F12</kbd>Print</button>
  </div>

  <footer class="sb" id="sb"></footer>
</div>

<div id="prt"></div>
<style id="pgs"></style>
<div id="toast" role="status"></div>
<div id="ov"></div>
<div id="lock-ov" style="display:none"></div>

<script>
const NGN = n => '₦' + Math.round(n).toLocaleString('en-NG');
const T = t => new Date(t).toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' });
const $ = s => document.querySelector(s);

// Category hue palette
const HUE_MAP = {
  'GROCERY': '#17674A',
  'BEVERAGES': '#2B6CB0',
  'TOILETRIES': '#7B4FA3',
  'BRUSH': '#B8741A',
  'HOUSEHOLD': '#9A5F10',
  'GENERAL': '#4A5568'
};

const getHue = cat => HUE_MAP[(cat || '').toUpperCase()] || '#17674A';

let state = {
  view: 'sell',
  vw: 'list', // 'list' or 'grid'
  theme: 'auto',
  terminalId: localStorage.getItem('pos_terminal_id') || '',
  user: null,
  isLocked: true,
  pinInput: '',
  customer: { id: '1560234000000095179', name: 'Walk-in Customer' },
  cat: 'All',
  q: '',
  cart: {}, // id: { qty, unitIndex, customPrice }
  heldCarts: JSON.parse(localStorage.getItem('qs_held_carts') || '[]'),
  disc: 0,
  pay: 'Cash',
  tender: '',
  syncing: false,
  pulling: false,
  items: [],
  customers: [],
  sales: [],
  pendingCount: 0,
  lastSyncTime: null,
  lanIp: '192.168.100.18',
  lanUrl: 'http://192.168.100.18:3001',
  installedPrinters: [],
  pp: {
    destination: 'direct', // 'direct' (Silent thermal print without dialog) or 'browser' (Manual print dialog)
    autoPrint: true,
    printer: 'System default printer',
    printMode: 'direct',
    paper: '80',
    copies: 2,
    hdr: true,
    vat: false,
    companyName: 'QUALITY SUPERSTORES',
    address: '16, Ogo Oluwa St, Ketere Market, Sango, Ogun State',
    phones: '0803 456 7890, 0812 345 6789',
    branch: 'KETERE BRANCH',
    salesperson: ''
  }
};

// Apply preferences
try {
  const p = JSON.parse(localStorage.getItem('qs-prefs') || 'null');
  if (p) {
    state.theme = p.theme || 'auto';
    if (p.pp) {
      Object.assign(state.pp, p.pp);
      // Migrate old 'terminal' or 'server' destination to 'direct' for silent zero-dialog printing
      if (state.pp.destination === 'terminal' || state.pp.destination === 'server' || !state.pp.destination) {
        state.pp.destination = 'direct';
      }
      if (state.pp.address === 'Ketere Market Road, Saki, Oyo State' || !state.pp.address) {
        state.pp.address = '16, Ogo Oluwa St, Ketere Market, Sango, Ogun State';
      }
      if (!state.pp.copies || state.pp.copies < 2) {
        state.pp.copies = 2;
      }
    }
  }
} catch(e) {}

function applyTheme() {
  const r = document.documentElement;
  if (state.theme === 'auto') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', state.theme);
}
applyTheme();

function savePrefs() {
  try {
    localStorage.setItem('qs-prefs', JSON.stringify({ theme: state.theme, pp: state.pp }));
  } catch(e) {}
}

function saveHeldCarts() {
  try {
    localStorage.setItem('qs_held_carts', JSON.stringify(state.heldCarts));
  } catch(e) {}
}

// Audio Synthesizer via Web Audio API (zero audio files needed, works offline)
let audioCtx = null;
function playSound(type) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'beep' || type === 'scan') {
      // Crisp 880Hz -> 1320Hz electronic cashier beep (60ms)
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.05);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now);
      osc.stop(now + 0.06);
    } else if (type === 'error' || type === 'out') {
      // Low dual warning buzz (180ms)
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(180, now + 0.08);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.start(now);
      osc.stop(now + 0.18);
    } else if (type === 'success' || type === 'sale') {
      // Melodic 2-tone chime on successful payment
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    }
  } catch(e) {}
}

function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.style.display = 'none', 3800);
}

// Helpers for items
function getItem(id) {
  return state.items.find(it => String(it.id) === String(id));
}

function getItemUnits(it) {
  if (!it || !it.units || !it.units.length) {
    return [{ name: it?.base_unit || 'unit', label: 'Unit', price: it?.retail_price || 0, is_base: true, conversion_ratio: 1, unit_conversion_id: '' }];
  }
  return it.units;
}

function getCartLine(id) {
  const it = getItem(id);
  if (!it) return null;
  const c = state.cart[id] || { qty: 1, unitIndex: 0, customPrice: null };
  const units = getItemUnits(it);
  const u = units[c.unitIndex] || units[0];
  const listPrice = u.price;
  const activePrice = c.customPrice !== null ? c.customPrice : listPrice;
  return {
    item: it,
    qty: c.qty,
    unitIndex: c.unitIndex,
    unit: u,
    listPrice: listPrice,
    price: activePrice,
    total: activePrice * c.qty
  };
}

function calcTotals() {
  let sub = 0, n = 0;
  for (const id in state.cart) {
    const L = getCartLine(id);
    if (L) {
      sub += L.total;
      n += L.qty;
    }
  }
  const disc = (sub * state.disc) / 100;
  const total = sub - disc;
  return { sub, n, disc, total };
}

// Load from server with persistent standalone offline fallback
async function loadCatalog() {
  try {
    const r = await fetch('/api/catalog');
    if (r.ok) {
      state.items = await r.json();
      try { localStorage.setItem('qs_cached_catalog', JSON.stringify(state.items)); } catch(e) {}
      renderMain();
      return;
    }
  } catch(e) {
    console.warn('Host Hub offline. Loading catalog from standalone browser storage...', e);
  }
  // Standalone offline fallback
  const cached = localStorage.getItem('qs_cached_catalog');
  if (cached) {
    try {
      state.items = JSON.parse(cached);
      console.log('✓ Loaded catalog from local standalone cache (' + state.items.length + ' items)');
    } catch(e) {}
  }
  renderMain();
}

async function loadCustomers() {
  try {
    const r = await fetch('/api/customers');
    if (r.ok) {
      state.customers = await r.json();
      try { localStorage.setItem('qs_cached_customers', JSON.stringify(state.customers)); } catch(e) {}
      if (state.customers.length && !state.customer.id) {
        state.customer = { id: state.customers[0].id, name: state.customers[0].display_name || state.customers[0].name };
      }
      return;
    }
  } catch(e) {
    console.warn('Host Hub offline. Loading customers from standalone browser storage...', e);
  }
  // Standalone offline fallback
  const cached = localStorage.getItem('qs_cached_customers');
  if (cached) {
    try {
      state.customers = JSON.parse(cached);
      if (state.customers.length && !state.customer.id) {
        state.customer = { id: state.customers[0].id, name: state.customers[0].display_name || state.customers[0].name };
      }
    } catch(e) {}
  }
}

async function loadQueueStatus() {
  try {
    const [qRes, sRes] = await Promise.all([
      fetch('/api/queue').then(r => r.json()).catch(() => null),
      fetch('/api/status').then(r => r.json()).catch(() => null)
    ]);
    if (qRes || sRes) {
      state.hubOffline = false;
      flushEmergencySalesToHub();
    } else {
      state.hubOffline = true;
    }
    if (qRes) {
      state.pendingCount = qRes.pending_count || 0;
      state.sales = qRes.sales || [];
    }
    if (sRes && sRes.local_ip) {
      state.lanIp = sRes.local_ip;
      state.lanUrl = sRes.lan_url || `http://${sRes.local_ip}:${sRes.port || 3001}`;
    }
    if (sRes && sRes.sync_info) {
      const prevSyncTime = state.syncInfo?.last_sync_time;
      state.syncInfo = sRes.sync_info;
      if (prevSyncTime && sRes.sync_info.last_sync_time && prevSyncTime !== sRes.sync_info.last_sync_time) {
        Promise.all([
          fetch('/api/catalog').then(r => r.json()).then(items => { state.items = items; }),
          fetch('/api/customers').then(r => r.json()).then(custs => { state.customers = custs; })
        ]).then(() => {
          const active = document.activeElement;
          const isSearching = active && active.id === 'q';
          if (!isSearching) renderMain();
        }).catch(() => {});
      }
    }
    renderTop();
    renderNav();
    renderSb();
    if (state.view === 'orders') renderMain();
  } catch(e) {
    state.hubOffline = true;
    renderTop();
    renderNav();
    renderSb();
  }
}

function enterPinDigit(d) {
  if (state.pinInput.length >= 4) return;
  state.pinInput += String(d);
  renderLockScreen();
  if (state.pinInput.length === 4) {
    submitPin();
  }
}

function backspacePin() {
  state.pinInput = state.pinInput.slice(0, -1);
  renderLockScreen();
}

function clearPin() {
  state.pinInput = '';
  renderLockScreen();
}

async function submitPin() {
  const pin = state.pinInput;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    }).then(r => r.json());

    if (res && res.success && res.user) {
      state.user = res.user;
      sessionStorage.setItem('pos_user', JSON.stringify(res.user));
      state.isLocked = false;
      state.pinInput = '';
      if (res.user.terminal_id) {
        state.terminalId = res.user.terminal_id;
        localStorage.setItem('pos_terminal_id', res.user.terminal_id);
      }
      renderLockScreen();
      renderTop();
      renderNav();
      renderSb();
      renderMain();
      toast(`✓ Unlocked! Welcome, ${res.user.name}`);
    } else {
      const card = $('#pin-card');
      if (card) {
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 450);
      }
      const errEl = $('#pin-err');
      if (errEl) errEl.textContent = res.message || 'Invalid PIN. Try again.';
      state.pinInput = '';
      setTimeout(() => renderLockScreen(), 600);
    }
  } catch(e) {
    // Standalone fallback: Authenticate against cached staff accounts
    const cachedUsersStr = localStorage.getItem('qs_cached_users');
    let fallbackUser = null;
    if (cachedUsersStr) {
      try {
        const users = JSON.parse(cachedUsersStr);
        fallbackUser = users.find(u => u.pin === pin);
      } catch(err) {}
    } else {
      // Default built-in emergency fallback accounts
      const emergencyUsers = [
        { id: 'u1', name: 'Funmilayo', pin: '9545', role: 'admin', terminal_id: 'TERM-01' },
        { id: 'u5', name: 'Oluwatobi', pin: '6935', role: 'finance', terminal_id: 'OFFICE-01' },
        { id: 'u2', name: 'Oluwatosin', pin: '5713', role: 'cashier', terminal_id: 'KETERE 2' },
        { id: 'u3', name: 'Cashier 2', pin: '5917', role: 'cashier', terminal_id: 'TERM-02' }
      ];
      fallbackUser = emergencyUsers.find(u => u.pin === pin);
    }

    if (fallbackUser) {
      state.user = fallbackUser;
      sessionStorage.setItem('pos_user', JSON.stringify(fallbackUser));
      state.isLocked = false;
      state.pinInput = '';
      if (fallbackUser.terminal_id) {
        state.terminalId = fallbackUser.terminal_id;
        localStorage.setItem('pos_terminal_id', fallbackUser.terminal_id);
      }
      renderLockScreen();
      renderTop();
      renderNav();
      renderSb();
      renderMain();
      toast(`⚡ Standalone Mode: Unlocked as ${fallbackUser.name} (Hub Server Offline)`);
      return;
    }

    const card = $('#pin-card');
    if (card) {
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 450);
    }
    const errEl = $('#pin-err');
    if (errEl) errEl.textContent = 'Hub Offline: Enter valid staff PIN';
    state.pinInput = '';
    setTimeout(() => renderLockScreen(), 600);
  }
}

async function hardResetAppCache() {
  if (confirm('This will purge the browser service worker cache and reload fresh code from the server. Proceed?')) {
    try {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const reg of registrations) {
          await reg.unregister();
        }
      }
      if ('caches' in window) {
        const cacheKeys = await caches.keys();
        for (const key of cacheKeys) {
          await caches.delete(key);
        }
      }
      localStorage.removeItem('qs_cached_catalog');
    } catch(e) {}
    window.location.reload(true);
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

  state.q = val;

function handleSearchKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const q = state.q.toLowerCase().trim();
    if (!q) return;
    const filtered = state.items.filter(it => {
      const matchUpc = it.upc && (it.upc.trim() === q || it.upc.includes(q));
      const matchSku = it.sku && it.sku.toLowerCase() === q;
      const matchName = it.name.toLowerCase().includes(q);
      const matchId = it.id && String(it.id) === q;
      return matchUpc || matchSku || matchName || matchId;
    });
    if (filtered.length > 0) {
      const exact = filtered.find(it => it.upc && it.upc.trim() === q) ||
                    filtered.find(it => it.sku && it.sku.toLowerCase() === q) ||
                    filtered.find(it => it.name.toLowerCase() === q) ||
                    filtered[0];
      const added = addToCart(exact.id);
      state.q = '';
      const input = $('#q');
      if (input) input.value = '';
      $('#grid').innerHTML = renderCatalogHTML();
      if (added) {
        toast(`Scanned & Added: ${exact.name}`);
      }
    } else {
      toast(`No product found matching "${q}"`);
    }
  }
}

function getUnitRatio(u) {
  if (!u) return 1;
  if (u.is_base) return 1;
  if (u.units_per_bulk) return u.units_per_bulk;
  if (u.conversion_ratio > 1) return u.conversion_ratio;
  if (u.conversion_ratio > 0 && u.conversion_ratio < 1) return Math.round(1 / u.conversion_ratio);
  return 1;
}

// Inventory Count calculation across packaging units
function getStockInfo(it, unitIdx) {
  const units = getItemUnits(it);
  const curIdx = unitIdx != null ? unitIdx : (itemPickUnit[it.id] || 0);
  const selectedUnit = units[curIdx] || units[0] || { name: 'pcs', unit_symbol: 'pcs', is_base: true };

  const bulkUnit = units.find(u => u && !u.is_base) || units[units.length - 1] || selectedUnit;
  const baseUnit = units.find(u => u && u.is_base) || units[0] || selectedUnit;
  const ratio = getUnitRatio(bulkUnit) || 1;

  // Raw recorded stock in bulk units
  const rawBulk = parseFloat(it.stock) || 0;
  
  // Local quantity in cart
  const cartItem = state.cart[it.id];
  const cartRatio = cartItem ? getUnitRatio(units[cartItem.unitIndex]) : 1;
  const inCartBase = cartItem ? (cartItem.qty * cartRatio) : 0;
  
  // Total available in base units (packs / pieces)
  const totalBase = Math.max(0, Math.round(rawBulk * ratio) - inCartBase);

  if (totalBase <= 0) {
    return {
      totalBase: 0,
      isOut: true,
      isLow: false,
      text: 'Out of stock'
    };
  }

  if (!selectedUnit || selectedUnit.is_base || ratio === 1) {
    const sym = (selectedUnit?.unit_symbol || selectedUnit?.name || 'pcs').toLowerCase();
    return {
      totalBase: totalBase,
      isOut: false,
      isLow: totalBase <= (ratio > 1 ? ratio : 5),
      text: `${totalBase.toLocaleString()} ${sym}`
    };
  } else {
    const whole = Math.floor(totalBase / ratio);
    const rem = totalBase % ratio;
    const bulkSym = (selectedUnit?.unit_symbol || selectedUnit?.name || 'ctn').toLowerCase();
    const baseSym = (baseUnit?.unit_symbol || baseUnit?.name || 'pcs').toLowerCase();

    let text = `${whole} ${bulkSym}`;
    if (rem > 0) {
      text += ` + ${rem} ${baseSym}`;
    }

    return {
      totalBase: totalBase,
      isOut: false,
      isLow: whole < 2,
      text: text
    };
  }
}

function renderCatalogHTML() {
  if (!state.items || !state.items.length) {
    return `
      <div class="empty" style="grid-column:1/-1;padding:60px 24px;text-align:center">
        <div class="spin" style="margin:0 auto 16px;width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%"></div>
        <h3 style="margin:0 0 8px;color:var(--ink);font-size:16px">Connecting to POS Register...</h3>
        <p style="margin:0 0 16px;color:var(--mute);font-size:12px">Loading products and pricing catalog from local terminal hub...</p>
        <button class="btn p" onclick="forceCatalogReload()" style="font-size:12px;padding:8px 18px">
          <i class="fa-solid fa-rotate"></i> Retry Connection
        </button>
      </div>
    `;
  }

  const q = state.q.toLowerCase().trim();
  const cat = (state.cat || 'All').toUpperCase();
  const filtered = state.items.filter(it => {
    const matchesQ = !q ||
      it.name.toLowerCase().includes(q) ||
      (it.upc && it.upc.includes(q)) ||
      (it.sku && it.sku.toLowerCase().includes(q)) ||
      (it.id && String(it.id).includes(q));
    const itemCat = (it.category || 'General').toUpperCase();
    const matchesCat = cat === 'ALL' || itemCat === cat || (cat === 'FOODS' && (itemCat === 'FOODS' || itemCat === 'SEASONING' || itemCat === 'TOMATO PASTE')) || (cat === 'BEVERAGES' && (itemCat === 'BEVERAGES' || itemCat === 'DRINK'));
    return matchesQ && matchesCat;
  });

  if (!filtered.length) {
    return `<div class="empty" style="grid-column:1/-1">No items match your search.</div>`;
  }

  if (state.vw === 'list') {
    return `
      <table class="pt">
        <colgroup>
          <col style="width:auto">
          <col style="width:85px">
          <col style="width:78px">
          <col style="width:88px">
          <col style="width:90px">
          <col style="width:68px">
        </colgroup>
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Unit</th>
            <th style="text-align:right">Stock</th>
            <th style="text-align:right">Single Price</th>
            <th style="text-align:right">Bulk Price</th>
            <th class="col-act" style="text-align:right">Action</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(it => {
            try {
              const units = getItemUnits(it);
              const curIdx = (itemPickUnit[it.id] != null && units[itemPickUnit[it.id]]) ? itemPickUnit[it.id] : 0;
              const activeUnit = units[curIdx] || units[0] || { name: 'PCS', unit_symbol: 'PCS', price: it.retail_price || 0 };
              const stockInfo = getStockInfo(it, curIdx);

              const baseUnit = units.find(u => u && u.is_base) || units[0] || activeUnit;
              const bulkUnit = units.find(u => u && !u.is_base);
              const singlePrice = baseUnit ? (baseUnit.price != null ? baseUnit.price : (it.retail_price || 0)) : (it.retail_price || 0);
              const bulkPrice = bulkUnit ? bulkUnit.price : null;
              const itemName = it.name || 'Unnamed Product';
              const bulkSymbol = bulkUnit ? (bulkUnit.unit_symbol || bulkUnit.name || 'Bulk').toUpperCase() : '';

              return `
                <tr class="pr ${stockInfo.isOut ? 'out' : ''}" onclick="${stockInfo.isOut ? '' : `addToCart('${it.id}')`}">
                  <td class="td-name">
                    <div style="display:flex;align-items:center">
                      <span class="av" style="--h:${getHue(it.category)}">${(itemName[0] || 'P').toUpperCase()}</span>
                      <div style="min-width:0;flex:1">
                        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                          <b style="font-size:12.5px;color:var(--ink)">${itemName}</b>
                          <span class="cat-tag" style="--h:${getHue(it.category)}">${it.category || 'General'}</span>
                        </div>
                        ${it.upc ? `<div style="color:var(--mute);font-size:10px;margin-top:1px"><i class="fa-solid fa-barcode"></i> ${it.upc}</div>` : ''}
                      </div>

                  </td>
                  <td onclick="event.stopPropagation()">
                    <select class="us" onchange="setItemUnit('${it.id}', this.value)" ${stockInfo.isOut ? 'disabled' : ''}>
                      ${units.map((u, idx) => `<option value="${idx}" ${idx===curIdx?'selected':''}>${(u?.unit_symbol || u?.name || 'Unit').toUpperCase()}</option>`).join('')}
                    </select>
                  </td>
                  <td style="text-align:right">
                    <span class="stock-pill ${stockInfo.isOut ? 'out' : (stockInfo.isLow ? 'low' : 'in')}">
                      ${stockInfo.text}
                    </span>
                  </td>
                  <td style="text-align:right;font-weight:700;font-size:12px">${NGN(singlePrice)}</td>
                  <td style="text-align:right;font-weight:800;font-size:12px;color:var(--brand)">${bulkUnit && bulkPrice != null ? `${NGN(bulkPrice)} <small style="font-size:10px;font-weight:700;color:var(--mute)">/${bulkSymbol}</small>` : '<span style="color:var(--mute)">–</span>'}</td>
                  <td class="col-act" style="text-align:right">
                    ${stockInfo.isOut
                      ? `<button class="btn" style="padding:4px 6px;font-size:10.5px;opacity:0.5;cursor:not-allowed" disabled>Out</button>`
                      : `<button class="btn p" style="padding:4px 10px;font-size:11.5px;font-weight:700" onclick="event.stopPropagation(); addToCart('${it.id}')">+ Add</button>`
                    }
                  </td>
                </tr>
              `;
            } catch(eRow) {
              console.warn('Skipping unrenderable catalog row:', it?.id, eRow);
              return '';
            }
          }).join('')}
        </tbody>
      </table>
    `;
  }

  return filtered.map(it => {
    try {
      const units = getItemUnits(it);
      const curIdx = (itemPickUnit[it.id] != null && units[itemPickUnit[it.id]]) ? itemPickUnit[it.id] : 0;
      const activeUnit = units[curIdx] || units[0] || { name: 'PCS', unit_symbol: 'PCS', price: it.retail_price || 0 };
      const stockInfo = getStockInfo(it, curIdx);

      const baseUnit = units.find(u => u && u.is_base) || units[0] || activeUnit;
      const bulkUnit = units.find(u => u && !u.is_base);
      const singlePrice = baseUnit ? (baseUnit.price != null ? baseUnit.price : (it.retail_price || 0)) : (it.retail_price || 0);
      const bulkPrice = bulkUnit ? bulkUnit.price : null;
      const itemName = it.name || 'Unnamed Product';
      const bulkSymbol = bulkUnit ? (bulkUnit.unit_symbol || bulkUnit.name || 'Bulk').toUpperCase() : '';

      return `
        <div class="tile ${stockInfo.isOut ? 'out' : ''}" onclick="${stockInfo.isOut ? '' : `addToCart('${it.id}')`}">
          <div class="art" style="--h:${getHue(it.category)}">${itemName.slice(0, 2).toUpperCase()}</div>
          <b>${itemName}</b>
          <div class="m">
            <div style="display:flex;gap:6px;align-items:baseline;overflow:hidden">
              <span style="font-size:13px;font-weight:800;color:var(--ink)" title="Single Unit Price">${NGN(singlePrice)}</span>
              ${bulkUnit && bulkPrice != null ? `<span style="font-size:11px;font-weight:700;color:var(--brand);white-space:nowrap" title="Bulk Price">${bulkSymbol}: ${NGN(bulkPrice)}</span>` : ''}
            </div>
            <span class="stock-pill ${stockInfo.isOut ? 'out' : (stockInfo.isLow ? 'low' : 'in')}">${stockInfo.text}</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:auto" onclick="event.stopPropagation()">
            <select class="us" style="flex:1" onchange="setItemUnit('${it.id}', this.value)" ${stockInfo.isOut ? 'disabled' : ''}>
              ${units.map((u, idx) => `<option value="${idx}" ${idx===curIdx?'selected':''}>${(u?.unit_symbol || u?.name || 'Unit').toUpperCase()}</option>`).join('')}
            </select>
            <button class="btn p" style="padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap" onclick="addToCart('${it.id}')" ${stockInfo.isOut ? 'disabled' : ''}>
              + Add
            </button>
          </div>
        </div>
      `;
    } catch (eTile) {
      console.warn('Skipping unrenderable catalog tile:', it?.id, eTile);
      return '';
    }
  }).join('');
}

// Unit picker per catalog card
const itemPickUnit = {};
function setItemUnit(id, unitIdx) {
  itemPickUnit[id] = parseInt(unitIdx, 10);
  $('#grid').innerHTML = renderCatalogHTML();
}

// Cart actions with strict out-of-stock guard
function addToCart(id) {
  const it = getItem(id);
  if (!it) return false;

  const units = getItemUnits(it);
  const uIdx = state.cart[id] ? state.cart[id].unitIndex : (itemPickUnit[id] || 0);
  const selectedUnit = units[uIdx] || units[0];
  const unitRatio = getUnitRatio(selectedUnit);

  const bulkUnit = units.find(u => !u.is_base) || units[units.length - 1];
  const bulkRatio = getUnitRatio(bulkUnit);
  const rawBulk = parseFloat(it.stock) || 0;
  const maxAvailableBase = Math.round((rawBulk * bulkRatio) * 100) / 100;

  if (maxAvailableBase <= 0) {
    playSound('error');
    toast(`⛔ Cannot add "${it.name}": Product is OUT OF STOCK.`);
    return false;
  }

  const curQty = state.cart[id] ? state.cart[id].qty : 0;
  const isBulk = !selectedUnit.is_base;
  let newQty = curQty + 1;
  if (isBulk && curQty === 0.5) {
    newQty = 1;
  }
  const neededBase = Math.round((newQty * unitRatio) * 100) / 100;

  if (neededBase > maxAvailableBase) {
    playSound('error');
    const unitName = (selectedUnit.name || selectedUnit.unit_symbol || 'units').toUpperCase();
    const maxUnitsInSelected = isBulk ? (Math.floor(maxAvailableBase / unitRatio * 2) / 2) : Math.floor(maxAvailableBase / unitRatio);
    if (maxUnitsInSelected <= 0) {
      toast(`⚠️ Stock limit for "${it.name}": Only ${maxAvailableBase} base units left (cannot form 1 full ${unitName}).`);
    } else {
      toast(`⚠️ Stock limit reached for "${it.name}": Only ${maxUnitsInSelected} ${unitName} available.`);
    }
    return false;
  }

  if (!state.cart[id]) {
    state.cart[id] = { qty: 1, unitIndex: uIdx, customPrice: null };
  } else {
    state.cart[id].qty = newQty;
  }
  playSound('beep');
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
  return true;
}

function decCart(id) {
  if (state.cart[id]) {
    playSound('beep');
    const it = getItem(id);
    const units = it ? getItemUnits(it) : [];
    const u = units[state.cart[id].unitIndex] || units[0];
    const isBulk = u && !u.is_base;

    if (isBulk) {
      if (state.cart[id].qty > 1) {
        state.cart[id].qty = (state.cart[id].qty % 1 !== 0) ? Math.floor(state.cart[id].qty) : (state.cart[id].qty - 1);
      } else if (state.cart[id].qty === 1) {
        state.cart[id].qty = 0.5;
      } else {
        delete state.cart[id];
      }
    } else {
      state.cart[id].qty--;
      if (state.cart[id].qty <= 0) delete state.cart[id];
    }
  }
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
}

function handleCartQtyInput(id, val) {
  if (!state.cart[id]) return;
  const it = getItem(id);
  if (!it) return;
  const units = getItemUnits(it);
  const u = units[state.cart[id].unitIndex] || units[0];
  const isBulk = !u.is_base;

  const parsed = parseFloat(val);
  if (isNaN(parsed) || parsed <= 0) {
    return;
  }

  let validQty = parsed;
  if (!isBulk) {
    validQty = Math.max(1, Math.round(parsed));
  } else {
    validQty = Math.max(0.5, Math.round(parsed * 2) / 2);
  }

  const unitRatio = getUnitRatio(u);
  const bulkUnit = units.find(unit => !unit.is_base) || units[units.length - 1];
  const bulkRatio = getUnitRatio(bulkUnit);
  const rawBulk = parseFloat(it.stock) || 0;
  const maxAvailableBase = Math.round((rawBulk * bulkRatio) * 100) / 100;

  const neededBase = Math.round((validQty * unitRatio) * 100) / 100;
  if (neededBase > maxAvailableBase) {
    const maxAllowed = isBulk ? Math.max(0.5, Math.floor(maxAvailableBase / unitRatio * 2) / 2) : Math.max(1, Math.floor(maxAvailableBase / unitRatio));
    validQty = maxAllowed;
    toast(`⚠️ Maximum available stock for "${it.name}" is ${maxAllowed} ${(u.name || '').toUpperCase()}`);
    const inputEl = $(`#qty-${id}`);
    if (inputEl) inputEl.value = validQty;
  }

  state.cart[id].qty = validQty;

  const L = getCartLine(id);
  const lineTotEl = $(`#line-tot-${id}`);
  if (lineTotEl && L) {
    lineTotEl.textContent = NGN(L.total);
  }

  const t = calcTotals();
  const subCount = $('#cart-subtotal-count');
  if (subCount) subCount.textContent = t.n;
  const subVal = $('#cart-subtotal-val');
  if (subVal) subVal.textContent = NGN(t.sub);
  const totVal = $('#cart-total-val');
  if (totVal) totVal.textContent = NGN(t.total);

  updateTenderUI();
  if (state.pay === 'Split') updateSplitUI();
}

function handleCartQtyCommit(id, val) {
  if (!state.cart[id]) return;
  const parsed = parseFloat(val);
  if (isNaN(parsed) || parsed <= 0) {
    state.cart[id].qty = 1;
  }
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
}

function setCartUnit(id, unitIdx) {
  if (state.cart[id]) {
    const it = getItem(id);
    if (it) {
      const units = getItemUnits(it);
      const targetUnit = units[unitIdx] || units[0];
      const targetRatio = getUnitRatio(targetUnit);
      const bulkUnit = units.find(u => !u.is_base) || units[units.length - 1];
      const bulkRatio = getUnitRatio(bulkUnit);
      const rawBulk = parseFloat(it.stock) || 0;
      const maxAvailableBase = Math.round((rawBulk * bulkRatio) * 100) / 100;

      // If switching to base unit, enforce whole integer
      if (targetUnit.is_base && state.cart[id].qty % 1 !== 0) {
        state.cart[id].qty = Math.max(1, Math.round(state.cart[id].qty));
      }

      const neededBase = Math.round((state.cart[id].qty * targetRatio) * 100) / 100;
      if (neededBase > maxAvailableBase) {
        toast(`⚠️ Insufficient stock to switch "${it.name}" to ${(targetUnit.name || '').toUpperCase()} (Needs ${neededBase} base units, only ${maxAvailableBase} available).`);
        $('#cart').innerHTML = renderCartHTML();
        return;
      }
    }
    state.cart[id].unitIndex = parseInt(unitIdx, 10);
    state.cart[id].customPrice = null; // reset custom price to list price
    itemPickUnit[id] = parseInt(unitIdx, 10);
  }
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
}

function setCartPrice(id, val) {
  const p = parseFloat(val);
  if (state.cart[id] && !isNaN(p) && p >= 0) {
    state.cart[id].customPrice = p;
  }
  $('#cart').innerHTML = renderCartHTML();
}

function resetCartPrice(id) {
  if (state.cart[id]) state.cart[id].customPrice = null;
  const hasOtherCustom = Object.values(state.cart).some(c => c.customPrice !== null);
  if (!hasOtherCustom) {
    state.managerPriceApproved = false;
    state.managerPriceApprovedBy = null;
  }
  $('#cart').innerHTML = renderCartHTML();
}

function removeCartItem(id) {
  if (state.cart[id]) {
    delete state.cart[id];
  }
  const hasOtherCustom = Object.values(state.cart).some(c => c.customPrice !== null);
  if (!hasOtherCustom) {
    state.managerPriceApproved = false;
    state.managerPriceApprovedBy = null;
  }
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
}

function editCartItemPrice(id) {
  const L = getCartLine(id);
  if (!L) return;

  const isCashier = !state.user || state.user.role === 'cashier';
  if (isCashier) {
    openManagerOverrideModal({
      reason: `Cashiers cannot change prices on orders. Manager or Finance PIN required to edit rate for "${L.item.name}".`,
      onApprove: (manager) => {
        promptPriceChange(id, L, manager);
      },
      onReject: () => {
        toast('❌ Price modification cancelled: Cashiers cannot modify item prices.');
      }
    });
    return;
  }

  promptPriceChange(id, L, null);
}

function promptPriceChange(id, L, authorizedBy) {
  const isCustom = L.price !== L.listPrice;
  const promptText = isCustom
    ? `Current custom price: ₦${L.price.toLocaleString()} (List: ₦${L.listPrice.toLocaleString()})\nEnter new price per ${L.unit.name || 'unit'}, or leave empty to reset:`
    : `List price: ₦${L.listPrice.toLocaleString()}\nEnter custom price per ${L.unit.name || 'unit'}:`;
  const val = prompt(promptText, L.price);
  if (val !== null) {
    const trimmed = val.trim();
    if (trimmed === '' || (isCustom && parseFloat(trimmed) === L.listPrice)) {
      resetCartPrice(id);
      toast(`Reset "${L.item.name}" to standard catalog price.`);
    } else {
      const p = parseFloat(trimmed);
      if (!isNaN(p) && p >= 0) {
        setCartPrice(id, Math.round(p));
        if (authorizedBy) {
          state.managerPriceApproved = true;
          state.managerPriceApprovedBy = `${authorizedBy.name} (${authorizedBy.role.toUpperCase()})`;
        }
        toast(`✅ Price updated to ₦${Math.round(p).toLocaleString()}${authorizedBy ? ' (Authorized by ' + authorizedBy.name + ')' : ''}`);
      }
    }
  }
}

function clearCart() {
  if (!Object.keys(state.cart).length) return;
  state.cart = {};
  state.disc = 0;
  state.managerDiscountApproved = false;
  state.managerApprovedBy = null;
  state.managerPriceApproved = false;
  state.managerPriceApprovedBy = null;
  state.tender = '';
  $('#cart').innerHTML = renderCartHTML();
  $('#grid').innerHTML = renderCatalogHTML();
}

function setPaymentMode(mode) {
  state.pay = mode;
  if (mode === 'Split' && !state.split) {
    state.split = { cash: 0, moniepoint: 0, transfer: 0 };
  }
  $('#cart').innerHTML = renderCartHTML();
}

function handleTenderInput(val) {
  state.tender = val;
  updateTenderUI();
}

function updateTenderUI() {
  const t = calcTotals();
  const tend = parseFloat(state.tender) || 0;
  const short = state.pay === 'Cash' && state.tender !== '' && tend < t.total;
  
  const changeRow = $('#change-due-row');
  if (changeRow) {
    if (state.tender !== '' && !short) {
      changeRow.style.display = 'flex';
      const changeVal = $('#change-due-val');
      if (changeVal) changeVal.textContent = NGN(tend - t.total);
    } else {
      changeRow.style.display = 'none';
    }
  }

  const btn = $('#btn-charge');
  if (btn) {
    let chargeDisabled = !t.n;
    let chargeButtonLabel = 'Charge ' + NGN(t.total) + ' (F8)';
    const isWalkIn = !state.customer || state.customer.id === '1560234000000095179' || /walk\s*[-]?\s*in/i.test(state.customer.name || '');

    if (state.pay === 'Cash') {
      if (short) {
        chargeDisabled = true;
        chargeButtonLabel = 'Cash received is too low';
      }
    } else if (state.pay === 'Credit / On Account') {
      if (isWalkIn) {
        chargeDisabled = true;
        chargeButtonLabel = '⚠️ Select Registered Customer (F4)';
      } else {
        chargeButtonLabel = 'Create Invoice ' + NGN(t.total) + ' (On Account)';
      }
    }
    btn.disabled = chargeDisabled;
    btn.innerHTML = chargeButtonLabel;
  }
}

function updateSplitAmount(field, val) {
  if (!state.split) state.split = { cash: 0, moniepoint: 0, transfer: 0 };
  const p = parseFloat(val);
  state.split[field] = isNaN(p) ? 0 : Math.max(0, Math.round(p));
  updateSplitUI();
}

function fillSplitRemaining(field) {
  const t = calcTotals();
  if (!state.split) state.split = { cash: 0, moniepoint: 0, transfer: 0 };
  let otherAlloc = 0;
  for (const k in state.split) {
    if (k !== field) otherAlloc += (parseFloat(state.split[k]) || 0);
  }
  const rem = Math.max(0, Math.round(t.total - otherAlloc));
  state.split[field] = rem;
  const inputEl = $(`#split-${field}`);
  if (inputEl) inputEl.value = rem || '';
  updateSplitUI();
}

function updateSplitUI() {
  const t = calcTotals();
  const sc = parseFloat(state.split?.cash) || 0;
  const sm = parseFloat(state.split?.moniepoint) || 0;
  const st = parseFloat(state.split?.transfer) || 0;
  const splitTotal = sc + sm + st;
  const splitDiff = t.total - splitTotal;
  const splitBalanced = Math.abs(splitDiff) < 1;

  const statusEl = $('#split-status-badge');
  if (statusEl) {
    statusEl.className = `split-status ${splitBalanced ? 'ok' : (splitDiff > 0 ? 'warn' : 'err')}`;
    statusEl.textContent = splitBalanced ? '✓ Balanced' : (splitDiff > 0 ? `₦${splitDiff.toLocaleString()} remaining` : `₦${(-splitDiff).toLocaleString()} excess`);
  }

  const btn = $('#btn-charge');
  if (btn) {
    let chargeDisabled = !t.n;
    let chargeButtonLabel = `Charge ${NGN(t.total)} (Split Tender)`;
    if (!splitBalanced) {
      chargeDisabled = true;
      chargeButtonLabel = splitDiff > 0 ? `Allocate remaining ₦${splitDiff.toLocaleString()}` : `Over-allocated by ₦${(-splitDiff).toLocaleString()}`;
    }
    btn.disabled = chargeDisabled;
    btn.innerHTML = chargeButtonLabel;
  }
}

function renderCartHTML() {
  const t = calcTotals();
  const ids = Object.keys(state.cart);
  const tend = parseFloat(state.tender) || 0;
  const short = state.pay === 'Cash' && state.tender !== '' && tend < t.total;
  const isWalkIn = !state.customer || state.customer.id === '1560234000000095179' || /walk\s*[-]?\s*in/i.test(state.customer.name || '');

    ${state.pay === 'Split' ? `

            ${splitBalanced ? '✓ Balanced' : (splitDiff > 0 ? `₦${splitDiff.toLocaleString()} remaining` : `₦${(-splitDiff).toLocaleString()} excess`)}
          </span>

            <button type="button" class="split-fill" onclick="fillSplitRemaining('transfer')">Fill</button>

    ` : ''}

    <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 2px;margin:6px 0">
      <label style="font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--mute)" title="Hide product rates and amounts on printed receipt (Waybill / Delivery Slip)">
        <input type="checkbox" id="no-price-toggle" ${state.printWithoutPrice ? 'checked' : ''} onchange="state.printWithoutPrice = this.checked">

  `;

// =============================================================================
// EMERGENCY IN-BROWSER STANDALONE ENGINE (ACTIVE WHEN SERVER HUB IS OFF)
// =============================================================================
function saveEmergencyStandaloneSale(payload) {
  const emgQueue = getEmergencySalesQueue();
  const nowMs = Date.now();

  // Rapid multi-tap debounce guard: block duplicate taps within 4 seconds in standalone mode
  const lastSale = emgQueue[emgQueue.length - 1];
  if (lastSale && lastSale.created_at) {
    const diffMs = nowMs - new Date(lastSale.created_at).getTime();
    if (diffMs >= 0 && diffMs < 4000) {
      if (lastSale.total === payload.total && 
          (lastSale.line_items || []).length === (payload.line_items || []).length &&
          lastSale.customer_id === payload.customer_id) {
        console.warn('⛔ [Standalone Guard] Rapid duplicate checkout tap ignored.');
        return {
          success: true,
          sale: lastSale,
          is_standalone: true,
          duplicate_prevented: true,
          message: `Standalone Mode: Sale already queued as ${lastSale.receipt_number}`
        };
      }
    }
  }

  const term = state.terminalId || 'STATION';
  const termClean = term.replace(/[^A-Za-z0-9]/g, '').slice(-6).toUpperCase();
  const seqKey = `qs_emg_seq_${termClean}`;
  let seq = parseInt(localStorage.getItem(seqKey) || '0', 10) + 1;
  localStorage.setItem(seqKey, String(seq));

  const orderId = `QS-EMG-${termClean}-${String(seq).padStart(4, '0')}`;
  const tiller = state.user?.name || 'Staff';

  const emgSale = {
    ...payload,
    id: payload.client_txn_id || `emg_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
    client_txn_id: payload.client_txn_id || null,
    order_id: orderId,
    receipt_number: orderId,
    tilled_by: tiller,
    salesperson: tiller,
    terminal_id: state.terminalId,
    standalone_offline: true,
    status: 'STANDALONE_LOCAL_QUEUE',
    created_at: new Date().toISOString()
  };

  emgQueue.push(emgSale);
  try { localStorage.setItem('qs_emergency_sales', JSON.stringify(emgQueue)); } catch(e) {}

  return {
    success: true,
    sale: emgSale,
    is_standalone: true,
    message: `Standalone Mode: Sale queued locally as ${orderId}`
  };
}

let isFlushingEmergency = false;
async function flushEmergencySalesToHub() {
  if (isFlushingEmergency) return;
  const emgQueue = getEmergencySalesQueue();
  if (!emgQueue || emgQueue.length === 0) return;

  isFlushingEmergency = true;
  try {
    const ping = await fetch('/api/status').then(r => r.json()).catch(() => null);
    if (!ping) {
      isFlushingEmergency = false;
      return;
    }

    let syncedCount = 0;
    const remaining = [];

    for (const emgSale of emgQueue) {
      try {
        const r = await fetch('/api/sales', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(emgSale)
        });
        const res = await r.json();
        if (res && res.success) {
          syncedCount++;
        } else {
          remaining.push(emgSale);
        }
      } catch (err) {
        remaining.push(emgSale);
      }
    }

    try { localStorage.setItem('qs_emergency_sales', JSON.stringify(remaining)); } catch(e) {}

    if (syncedCount > 0) {
      toast(`☁️ Hub Reconnected! Synced ${syncedCount} standalone offline sale(s) to server.`);
      playSound('success');
      await loadQueueStatus();
      renderSb();
    }
  } catch(e) {
    console.warn('Auto-flush error:', e);
  } finally {
    isFlushingEmergency = false;
  }
}

// Background auto-flush timer & online listener
setInterval(flushEmergencySalesToHub, 12000);
window.addEventListener('online', flushEmergencySalesToHub);

// Checkout mutex locking against rapid double/triple clicks
let isProcessingCheckout = false;

// Complete sale & save to offline outbox
async function chargeSale() {
  if (isProcessingCheckout) {
    console.warn('⛔ Checkout already in progress. Ignoring duplicate trigger.');
    return;
  }

  const t = calcTotals();
  if (!t.n) {
    toast('Add items to the cart first.');
    return;
  }

  isProcessingCheckout = true;
  const chargeBtn = document.getElementById('btn-charge');
  if (chargeBtn) {
    chargeBtn.disabled = true;
    chargeBtn.style.opacity = '0.7';
    chargeBtn.innerHTML = '<span class="spin" style="display:inline-block;width:13px;height:13px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:middle"></span> Processing Checkout...';
  }

  try {
    // Strict stock validation: block checkout if any item is out of stock or exceeds stock
    for (const id of Object.keys(state.cart)) {
      const it = getItem(id);
      if (!it) continue;
      const units = getItemUnits(it);
      const cartEntry = state.cart[id];
      const unit = units[cartEntry.unitIndex] || units[0];
      const unitRatio = getUnitRatio(unit);
      const bulkUnit = units.find(u => !u.is_base) || units[units.length - 1];
      const bulkRatio = getUnitRatio(bulkUnit);
      const rawBulk = parseFloat(it.stock) || 0;
      const maxAvailableBase = Math.round((rawBulk * bulkRatio) * 100) / 100;
      const requestedBase = Math.round((cartEntry.qty * unitRatio) * 100) / 100;

      if (maxAvailableBase <= 0) {
        toast(`⛔ Checkout blocked: "${it.name}" is OUT OF STOCK. Remove it to proceed.`);
        return;
      }
      if (requestedBase > maxAvailableBase) {
        const unitName = (unit.name || unit.unit_symbol || 'units').toUpperCase();
        const isBulk = !unit.is_base;
        const maxUnitsInSelected = isBulk ? (Math.floor(maxAvailableBase / unitRatio * 2) / 2) : Math.floor(maxAvailableBase / unitRatio);
        toast(`⛔ Checkout blocked: Insufficient stock for "${it.name}". Only ${maxUnitsInSelected} ${unitName} available.`);
        return;
      }
    }

    let paymentModeDisplay = state.pay;
    let paymentArray = [];
    const isCredit = state.pay === 'Credit / On Account';

    if (isCredit) {
      const isWalkIn = !state.customer || state.customer.id === '1560234000000095179' || /walk\s*[-]?\s*in/i.test(state.customer.name || '');
      if (isWalkIn) {
        toast('⚠️ Please select a registered customer account (F4) to create an invoice on credit.');
        openCustomerModal();
        return;
      }
      paymentModeDisplay = 'Credit / On Account';
      paymentArray = [{ mode: 'Credit / On Account', amount: 0 }];
    } else if (state.pay === 'Split') {
      const sc = parseFloat(state.split?.cash) || 0;
      const sm = parseFloat(state.split?.moniepoint) || 0;
      const st = parseFloat(state.split?.transfer) || 0;
      const totalAlloc = sc + sm + st;
      if (Math.abs(totalAlloc - t.total) >= 1) {
        toast(`Split amounts (₦${totalAlloc.toLocaleString()}) must match total (₦${t.total.toLocaleString()})`);
        return;
      }
      if (sc > 0) paymentArray.push({ mode: 'Cash', amount: sc });
      if (sm > 0) paymentArray.push({ mode: 'Moniepoint POS', amount: sm });
      if (st > 0) paymentArray.push({ mode: 'First Bank Transfer', amount: st });

      paymentModeDisplay = `Split (${paymentArray.map(p => `${p.mode.replace(' POS', '').replace(' Bank Transfer', '')}: ₦${p.amount.toLocaleString()}`).join(', ')})`;
    } else {
      paymentArray.push({ mode: state.pay, amount: t.total });
    }

    const lineItems = Object.keys(state.cart).map(id => {
      const L = getCartLine(id);
      return {
        item_id: L.item.id,
        name: L.item.name,
        unit: L.unit.unit_symbol || L.unit.name,
        unit_display: (L.unit.name || '').toUpperCase(),
        unit_conversion_id: L.unit.unit_conversion_id || '',
        quantity: L.qty,
        rate: L.price,
        list_price: L.listPrice,
        is_custom_price: L.price !== L.listPrice,
        total: L.total
      };
    });

    const tenderVal = parseFloat(state.tender) || 0;
    if (!state.user) {
      state.isLocked = true;
      renderLockScreen();
      toast('🔒 Login required: Please enter your cashier PIN.');
      return;
    }

    const amountPaid = isCredit ? 0 : (tenderVal >= t.total ? tenderVal : t.total);
    const changeDue = isCredit ? 0 : Math.max(0, amountPaid - t.total);
    const clientTxnId = 'qs_txn_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);

    const salePayload = {
      client_txn_id: clientTxnId,
      terminal_id: state.terminalId,
      user_id: state.user.id,
      user_name: state.user.name,
      customer_id: state.customer.id,
      customer_name: state.customer.name,
      salesperson: state.user.name,
      tilled_by: state.user.name,
      date: new Date().toISOString().split('T')[0],
      payment_mode: paymentModeDisplay,
      payments: paymentArray,
      amount_paid: amountPaid,
      change: changeDue,
      subtotal: t.sub,
      discount: state.disc || 0,
      manager_override: !!(state.managerDiscountApproved || state.managerPriceApproved),
      manager_override_by: state.managerApprovedBy || state.managerPriceApprovedBy || null,
      total: t.total,
      line_items: lineItems,
      is_credit: isCredit,
      without_price: !!state.printWithoutPrice
    };

    let res = null;
    let isStandaloneOffline = false;

    try {
      const r = await fetch('/api/sales', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(salePayload)
      });
      res = await r.json();
    } catch(e) {
      console.warn('Host Hub Server unreachable. Saving sale in Standalone Emergency Outbox...', e);
      isStandaloneOffline = true;
      res = saveEmergencyStandaloneSale(salePayload);
    }

    if (res && res.success) {
      if (!res.duplicate_prevented) {
        lineItems.forEach(l => {
          const it = getItem(l.item_id);
          if (it) {
            const u = (it.units || []).find(x => (x.unit_symbol === l.unit || x.name === l.unit)) || it.units?.[0];
            const ratio = getUnitRatio(u);
            const bulkUnit = (it.units || []).find(x => !x.is_base) || it.units?.[it.units.length - 1];
            const bulkRatio = getUnitRatio(bulkUnit);
            const soldBulk = (l.quantity * ratio) / bulkRatio;
            it.stock = Math.max(0, (parseFloat(it.stock) || 0) - soldBulk);
          }
        });
        try { localStorage.setItem('qs_cached_catalog', JSON.stringify(state.items)); } catch(err) {}

        // If credit sale, update customer's owing debt balance locally and in memory
        if (isCredit && state.customer) {
          const prevDebt = parseFloat(state.customer.outstanding) || 0;
          const newDebt = Math.round((prevDebt + t.total) * 100) / 100;
          state.customer.outstanding = newDebt;
          const cIdx = state.customers.findIndex(c => String(c.id) === String(state.customer.id));
          if (cIdx >= 0) {
            state.customers[cIdx].outstanding = newDebt;
          }
          try { localStorage.setItem('qs_cached_customers', JSON.stringify(state.customers)); } catch(e) {}
        }
      }

      state.cart = {};
      state.disc = 0;
      state.managerDiscountApproved = false;
      state.managerApprovedBy = null;
      state.managerPriceApproved = false;
      state.managerPriceApprovedBy = null;
      state.tender = '';
      state.split = { cash: 0, moniepoint: 0, transfer: 0 };
      await loadQueueStatus();
      renderMain();
      playSound('success');

      // Printing & Cash Drawer Kick (Silent direct thermal printing without dialog)
      if (state.pp.autoPrint !== false) {
        if (state.pp.destination === 'browser') {
          printTerminalReceipt(res.sale);
        } else {
          doDirectPrint(res.sale);
        }
      } else {
        showReceiptModal(res.sale);
      }

      if (res.duplicate_prevented) {
        toast(`ℹ️ Duplicate prevented: Order #${res.sale.receipt_number || res.sale.order_id} already recorded.`);
      } else if (isCredit) {
        toast(`✅ Invoice #${res.sale.receipt_number || res.sale.order_id} created on account! ${state.customer.name} owes ₦${Number(state.customer.outstanding).toLocaleString()}`);
      } else if (isStandaloneOffline) {
        toast(`⚡ Standalone Mode: Receipt ${res.sale.receipt_number} saved locally (Hub Server Offline)`);
      } else {
        toast(`Receipt ${res.sale.receipt_number} saved & settled.`);
      }
    } else {
      toast('❌ Error: ' + (res?.message || 'Transaction could not be completed'));
    }
  } finally {
    setTimeout(() => {
      isProcessingCheckout = false;
      const btn = document.getElementById('btn-charge');
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }, 1200);
  }
}

// Hold / Park & Recall Cart Engine
function holdCurrentCart(silent = false) {
  if (!Object.keys(state.cart).length) return;
  const totals = calcTotals();
  const held = {
    id: 'HOLD-' + Date.now().toString(36).toUpperCase(),
    time: new Date().toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' }),
    customer: { ...state.customer },
    cart: JSON.parse(JSON.stringify(state.cart)),
    disc: state.disc,
    managerDiscountApproved: state.managerDiscountApproved || false,
    managerApprovedBy: state.managerApprovedBy || null,
    managerPriceApproved: state.managerPriceApproved || false,
    managerPriceApprovedBy: state.managerPriceApprovedBy || null,
    total: totals.total,
    itemCount: totals.n
  };
  state.heldCarts.unshift(held);
  saveHeldCarts();
  state.cart = {};
  state.disc = 0;
  state.managerDiscountApproved = false;
  state.managerApprovedBy = null;
  state.managerPriceApproved = false;
  state.managerPriceApprovedBy = null;
  state.tender = '';
  state.customer = { id: '1560234000000095179', name: 'Walk-in Customer' };
  renderMain();
  if (!silent) {
    toast(`🛒 Cart parked on hold (${held.itemCount} items). Next customer ready!`);
    playSound('beep');
  }
}

function handleHoldRecallKey() {
  if (Object.keys(state.cart).length > 0) {

function resumeHeldCart(idx) {
  const held = state.heldCarts[idx];
  if (!held) return;

  const currentHasItems = Object.keys(state.cart).length > 0;
  if (currentHasItems) {
    if (!confirm('The current cart has items. Park the current cart first before resuming this one?')) {
      return;
    }
    holdCurrentCart(true); // silent park
  }

  state.cart = JSON.parse(JSON.stringify(held.cart));
  state.customer = { ...held.customer };
  state.disc = held.disc || 0;
  state.managerDiscountApproved = held.managerDiscountApproved || false;
  state.managerApprovedBy = held.managerApprovedBy || null;
  state.managerPriceApproved = held.managerPriceApproved || false;
  state.managerPriceApprovedBy = held.managerPriceApprovedBy || null;
  state.tender = '';
  state.heldCarts.splice(idx, 1);
  saveHeldCarts();
  closeModal();
  renderMain();
  toast(`🛒 Resumed cart for ${state.customer.name}!`);
  playSound('beep');
}

function deleteHeldCart(idx) {
  if (confirm('Discard this held cart?')) {
    state.heldCarts.splice(idx, 1);
    saveHeldCarts();
    if (state.heldCarts.length) openRecallModal();
    else closeModal();
    renderMain();
  }
}

function clearAllHeldCarts() {
  if (confirm('Discard all parked carts?')) {
    state.heldCarts = [];
    saveHeldCarts();
    closeModal();
    renderMain();
    toast('All held carts cleared.');
  }
}

// Sync to Zoho (Push Pending Sales)
async function triggerSync() {
  if (state.syncing) return;
  state.syncing = true;
  renderTop();
  renderMain();

  try {
    toast('☁️ Pushing pending sales to Zoho Books...');
    const r = await fetch('/api/sync', { method: 'POST' });
    const res = await r.json();
    toast(res.message || 'Sync complete');
    await loadQueueStatus();
  } catch(e) {
    toast('Sync error: ' + e.message);
  } finally {
    state.syncing = false;
    renderTop();
    renderMain();
  }
}

// Pull from Zoho (Customers & Live Inventory)
async function triggerPullSync() {
  if (state.pulling) return;
  state.pulling = true;
  renderTop();
  renderMain();

  try {
    toast('☁️ Pulling latest items & customers from Zoho...');
    const r = await fetch('/api/sync/pull', { method: 'POST' });
    const res = await r.json();
    if (res.success) {
      await loadCatalog();
      await loadCustomers();
      renderMain();
      toast('✅ ' + (res.message || 'Synced items & customers successfully!'));
    } else {
      toast('⚠️ ' + (res.message || 'Failed to pull from Zoho'));
    }
  } catch(e) {
    toast('Pull Sync error: ' + e.message);
  } finally {
    state.pulling = false;
    renderTop();
    renderMain();
  }
}

// Hardware & Direct Thermal Printing Engine
async function loadInstalledPrinters() {
  try {
    const r = await fetch('/api/hardware/printers');
    const res = await r.json();
    if (res.success && Array.isArray(res.printers)) {
      state.installedPrinters = res.printers;

      // Auto-assign thermal default printer if currently generic or unselected
      const current = state.pp.printer;
      const exists = res.printers.some(p => p.Name === current);
      if (!current || current === 'System default printer' || !exists) {
        const thermalMatch = res.printers.find(p => /xprinter|xp-80|xp80|pos|thermal|receipt|80mm|58mm/i.test(p.Name)) ||
                             res.printers.find(p => p.IsDefault) ||
                             res.printers[0];
        if (thermalMatch) {
          state.pp.printer = thermalMatch.Name;
          state.pp.destination = 'direct';
          state.pp.paper = /58/i.test(thermalMatch.Name) ? '58' : '80';
          savePrefs();
          renderSb();
        }
      }
    }
  } catch(e) {
    console.warn('Printer discovery:', e);
  }
}

function selectDefaultStationPrinter(printerName) {
  state.pp.printer = printerName;
  state.pp.destination = 'direct'; // Setting default printer ensures direct silent printing
  state.pp.autoPrint = true;
  if (/58/i.test(printerName)) {
    state.pp.paper = '58';
  } else {
    state.pp.paper = '80';
  }
  savePrefs();
  renderSb();
  toast(`✓ Set "${printerName}" as Default Station Printer (Direct Silent)`);
  if (state.activePrintSale) {
    showReceiptModal(state.activePrintSale, true);
  }
}

async function refreshAndReopenPrinterModal() {
  toast('Rescanning Windows printers...');
  await loadInstalledPrinters();
  if (state.activePrintSale) {
    showReceiptModal(state.activePrintSale, true);
  }
}

async function openCashDrawer() {
  try {

    const r = await fetch('/api/hardware/open-drawer', {
      method: 'POST',

    });

async function doDirectPrint(sale) {
  try {
    const targetPrinter = state.pp.printer === 'System default printer' ? '' : state.pp.printer;
    const numCopies = parseInt(state.pp.copies, 10) || 2;
    const r = await fetch('/api/hardware/print', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sale: sale,
        printer_name: targetPrinter,
        paper: state.pp.paper || '80',
        copies: numCopies,
        open_drawer: false
      })
    });
    const res = await r.json();
    if (res && res.success) {
      toast(`⚡ Printed ${numCopies} copies silently to ${targetPrinter || 'thermal printer'} (${sale.receipt_number || sale.order_id}).`);
      return true;
    } else {
      console.warn('Direct print note:', res?.message);
      toast('⚠️ Direct print note: ' + (res?.message || 'Printer busy') + '. Falling back to browser print...');
      printTerminalReceipt(sale);
      return false;
    }
  } catch(e) {
    console.warn('Direct print error:', e);
    toast('⚠️ Direct print error: ' + e.message + '. Falling back to browser print...');
    printTerminalReceipt(sale);
    return false;
  }
}

function printTerminalReceipt(sale) {
  const p = state.pp;
  const numCopies = parseInt(p.copies, 10) || 2;
  const labels = numCopies === 2 ? ['CUSTOMER COPY', 'STORE COPY'] : [];
  let html = '';
  for (let i = 0; i < numCopies; i++) {
    const label = labels[i] || (numCopies > 1 ? `COPY ${i + 1}` : '');
    html += tickHTML(sale, p, label);
    if (i < numCopies - 1) {
      html += '<div style="page-break-after:always;height:24px;border-bottom:1.5px dashed #000;margin:16px 0"></div>';
    }
  }
  $('#pgs').textContent = '@page{margin:0;size:' + (p.paper === 'A4' ? 'A4' : p.paper + 'mm auto') + '}';
  $('#prt').innerHTML = html;
  setTimeout(() => {
    window.print();
    toast(`Receipt dispatched (${numCopies} copies - ${sale.receipt_number || sale.order_id}).`);
  }, 100);
}
