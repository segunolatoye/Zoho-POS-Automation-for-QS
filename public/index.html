// Keyboard shortcuts (F1 - F12, Ctrl+E)
document.addEventListener('keydown', e => {
  if (state.isLocked) return;

  // Ctrl+E: Open Shift Close & Z-Report
  if (e.ctrlKey && (e.key === 'e' || e.key === 'E')) {
    e.preventDefault();
    openShiftCloseModal();
    return;
  }

  const k = e.key;
  if (k === 'F1') {
    e.preventDefault();
    $('#ov').innerHTML = `
      <div class="ov"><div class="modal">
        <h3>Cashier Keyboard Shortcuts</h3>
        <div style="display:grid;gap:6px;font-size:12.5px;margin:12px 0">
          <div class="row"><kbd class="kk">Ctrl+E</kbd> <span>Shift Close / Z-Report</span></div>
          <div class="row"><kbd class="kk">F2</kbd> <span>Focus Search bar</span></div>
          <div class="row"><kbd class="kk">F3</kbd> <span>Toggle Sell / Orders view</span></div>
          <div class="row"><kbd class="kk">F4</kbd> <span>Select Customer</span></div>
          <div class="row"><kbd class="kk">F5</kbd> <span>Hold / Recall Parked Cart</span></div>
          <div class="row"><kbd class="kk">F6</kbd> <span>Cycle Payment Method (Cash, POS, Transfer, Split)</span></div>
          <div class="row"><kbd class="kk">F7</kbd> <span>Open Price Manager</span></div>
          <div class="row"><kbd class="kk">F8</kbd> <span>Charge / Complete Sale</span></div>
          <div class="row"><kbd class="kk">F9</kbd> <span>Push Sales to Zoho (Shift+F9: Pull Stock & Cust)</span></div>
          <div class="row"><kbd class="kk">F10</kbd> <span>Toggle Theme</span></div>
          <div class="row"><kbd class="kk">F11</kbd> <span>Open Cash Drawer</span></div>
          <div class="row"><kbd class="kk">F12</kbd> <span>Print Last Receipt</span></div>
          <div class="row"><kbd class="kk">Esc</kbd> <span>Close active modal</span></div>
        </div>
        <button class="btn p" style="width:100%" onclick="closeModal()">Got it</button>
      </div></div>
    `;
  } else if (k === 'F2') {
    e.preventDefault();
    goView('sell');
    const q = $('#q');
    if (q) { q.focus(); q.select(); }
  } else if (k === 'F3') {
    e.preventDefault();
    goView(state.view === 'sell' ? 'orders' : 'sell');
  } else if (k === 'F4') {
    e.preventDefault();
    openCustomerModal();
  } else if (k === 'F6') {
    e.preventDefault();
    const modes = ['Cash', 'Moniepoint POS', 'First Bank Transfer', 'Split'];
    const next = modes[(modes.indexOf(state.pay) + 1) % modes.length];
    setPaymentMode(next);
    toast('Payment Mode: ' + next);
  } else if (k === 'F7') {
    e.preventDefault();
    openPriceManager();
  } else if (k === 'F8') {
    e.preventDefault();
    chargeSale();
  } else if (k === 'F9') {
    e.preventDefault();
    if (e.shiftKey) {
      triggerPullSync();
    } else {
      triggerSync();
    }
  } else if (k === 'F10') {
    e.preventDefault();
    toggleTheme();
  } else if (k === 'F11') {
    e.preventDefault();
    openCashDrawer();
  } else if (k === 'F12') {
    e.preventDefault();
    if (state.sales.length) previewPrintReceipt(state.sales[0].id);
  } else if (k === 'Escape') {
    closeModal();
  }
});

// Global Hardware Barcode Scanner Listener
let barcodeBuf = '';
let lastScanTime = 0;

document.addEventListener('keydown', e => {
  if (state.isLocked) return;
  const now = Date.now();
  const timeDiff = now - lastScanTime;
  lastScanTime = now;

  const active = document.activeElement;
  const isInput = active && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.tagName === 'TEXTAREA');

  if (e.key === 'Enter') {
    if (barcodeBuf.length >= 4) {
      const code = barcodeBuf.trim();
      barcodeBuf = '';
      const match = state.items.find(it => it.upc && it.upc.trim() === code) ||
                    state.items.find(it => it.sku && it.sku.toLowerCase() === code.toLowerCase()) ||
                    state.items.find(it => String(it.id) === code);
      if (match) {
        e.preventDefault();
        const added = addToCart(match.id);
        if (added) {
          toast(`Scanned & Added: ${match.name}`);
        }
        return;
      }
    }
    barcodeBuf = '';
    return;
  }

  // If characters arrive very rapidly (< 45ms between strokes) from hardware scanner
  if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    if (!isInput || active.id === 'q') {
      if (timeDiff > 120) {
        barcodeBuf = e.key;
      } else {
        barcodeBuf += e.key;
      }
    }
  }
});
